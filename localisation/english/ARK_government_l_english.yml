l_english:

## Authorities ##
auth_city_republic: "City-State Republic"
auth_city_republic_desc: "The state organs of a City-State Republic government are elected, and the various city-states and regions exercise political power within the basic framework of the Joint Council."
auth_city_despotism: "City-State Despotism"
auth_city_despotism_desc: "The supreme ruler of a City-State Despotism government holds sole state power and rules all city-states and regions arbitrarily.\n§RThis content is not yet complete!§!"
councilor_ruler_ark_doctor: "Doctor"
councilor_ruler_ark_doctor_female: "Doctor"
councilor_ruler_ark_doctor_desc: "The ruler of a City-State Republic does not necessarily hold a doctorate, but it has long been an unchanging tradition to call the leader the Doctor."
councilor_business_union: "Commercial Analyst"
councilor_business_union_female: "Commercial Analyst"
councilor_business_union_desc: "The Commercial Analyst coordinates and plans commercial activity within the nation, while also travelling the stars on behalf of the interests of corporate branch offices."
councilor_ark_pharmaceutical_enterprises: "Pharmaceutical Director"
councilor_ark_pharmaceutical_enterprises_female: "Pharmaceutical Director"
councilor_ark_pharmaceutical_enterprises_desc: "$TITLE$ leads the development and regulation of the pharmaceutical industry."
councilor_ark_health: "Minister of Health"
councilor_ark_health_female: "Minister of Health"
councilor_ark_health_desc: "$TITLE$ is responsible for decision-making and administration in the field of health."
councilor_logistics_companies: "Logistics Officer"
councilor_logistics_companies_female: "Logistics Officer"
councilor_logistics_companies_desc: "The Logistics Officer manages vast and complicated interstellar logistics routes."
councilor_investment_laboratories: "Budget Auditor"
councilor_investment_laboratories_female: "Budget Auditor"
councilor_investment_laboratories_desc: "Properly allocating enormous pooled funds among various research projects is no easy task."
councilor_security_contractors: "Minister of Intelligence"
councilor_security_contractors_female: "Minister of Intelligence"
councilor_security_contractors_desc: "The Minister of Intelligence leads a group of exceptionally capable intelligence personnel, protecting state secrets from leaking while doing their utmost to pry into the intelligence of rival nations."
councilor_holy_notarial_hall: "Dogma Executor"
councilor_holy_notarial_hall_female: "Dogma Executor"
councilor_holy_notarial_hall_desc: "The Pontiff is the superior body of the Holy Notarial Hall, responsible for overseeing the Executors in the fulfillment of their duties."
councilor_chivalry: "Grand Master of Knights"
councilor_chivalry_female: "Grand Master of Knights"
councilor_chivalry_desc: "Every officer and soldier of the National Defense Force is a member of the honored knighthood, and they obey the Grand Master of Knights, who holds the highest prestige."
councilor_heavy_taxation: "Tax Prosecutor"
councilor_heavy_taxation_female: "Tax Prosecutor"
councilor_heavy_taxation_desc: "The Tax Prosecutor ensures that every last coin of tax due arrives safely in the state treasury."
councilor_industry_manufacturers: "Minister of Military Industry"
councilor_industry_manufacturers_female: "Minister of Military Industry"
councilor_industry_manufacturers_desc: "The Minister of Military Industry manages the manufacture of military products nationwide, while assisting the construction departments with infrastructure."
councilor_circulation_business: "Minister of Light Industry"
councilor_circulation_business_female: "Minister of Light Industry"
councilor_circulation_business_desc: "The Minister of Light Industry manages the development of civilian industry within the nation, bringing all citizens products of sufficient quantity and guaranteed quality."
councilor_union_summit: "Summit Coordinator"
councilor_union_summit_female: "Summit Coordinator"
councilor_union_summit_desc: "The Summit Coordinator organizes and plans the Joint Summit held once every five years, providing the greatest possible help for exchange and cooperation among various interest groups."




## government ##
gov_ARK_terra_oligarchy: "Elite Republic"
gov_ARK_terra_oligarchy_desc:0 "An Elite Republic government is a joint government made up of elites from all walks of life, and the entire nation is governed by outstanding elites from the former nations."
RT_ARK_DOCTOR:0 "Speaker"
RT_ARK_DOCTOR_FEMALE:0 "Speaker"

#deprecated
gov_ark_elite_republic: "Elite Republic"
gov_ark_elite_republic_desc: "An Elite Republic government is a city-state republic made up of elites from all walks of life, and the entire nation is governed by outstanding elites from the various city-states."
gov_ark_holy_republic: "Holy Republic"
gov_ark_holy_republic_desc: "A Holy Republic government is a city-state republic of spiritualist ideology, in which the nation's political power is held by those universally recognized, highly respected religious leaders."
gov_ark_holy_witness_meeting: "Holy Witness Assembly"
gov_ark_holy_witness_meeting_desc: "The Holy Witness Assembly is a city-state republic of spiritualist ideology. Governance relies on a corps of civil servants guided by the divine, made up of enforcers, executors and judges, who restrain the citizenry and answer to them."
gov_ark_military_republic: "Military Republic"
gov_ark_military_republic_desc: "A Military Republic government is a militarist city-state republic. Unlike a military junta, the cabinet that holds state power must not only be rich in military experience but also emphasize substantial administrative credentials."
gov_ark_warrior_corps: "Warrior Corps"
gov_ark_warrior_corps_desc: "The Warrior Corps is a militarist form of city-state republic. All important decisions are made by a band of warriors - prestigious soldiers and knights with distinguished battle records."
gov_ark_star_knight: "Star Sea Knighthood"
gov_ark_star_knight_desc: "The Star Sea Knighthood is a militarist form of city-state republic. A knighthood upholding the faith of chivalry decides the direction the nation takes and bears the duty of defending it from foreign aggression."
gov_ark_harmonious_republic: "Harmonious Republic"
gov_ark_harmonious_republic_desc: "The Harmonious Republic is a peace-loving city-state republic that emphasizes displaying civic virtue, eliminating resentment and upholding tolerance, while safeguarding the lawful rights and safety of its citizens."
gov_ark_totalitarian_republic: "Totalitarian Republic"
gov_ark_totalitarian_republic_desc: "The Totalitarian Republic is a materialist city-state republic. Backed by powerful technology, it holds the nation's production targets and the people's standard of living in its grasp, achieving unprecedented strength and efficiency."
gov_ark_technology_federation: "Technology Federation"
gov_ark_technology_federation_desc: "The Technology Federation is a materialist city-state republic: a federation formed by gathering senior scholars and experts from all city-states, governing for the wellbeing and efficiency of the people."
gov_ark_bloodbath_republic: "Bloodbath Republic"
gov_ark_bloodbath_republic_desc: "The Bloodbath Republic is a form of city-state republic developed from fanatically xenophobic ideology, whose ultimate goal is to annihilate all alien species in blood and fire."
gov_ark_commercial_republic: "Commercial Republic"
gov_ark_commercial_republic_desc: "A Commercial Republic is a form of city-state republic that emerged as the city-state commercial society rose, where elites of countless large enterprises, companies and chambers of commerce turn business opportunities into wealth with keen commercial instincts."
gov_ark_constitutional_despotism: "Constitutional Despotism"
gov_ark_constitutional_despotism_desc: "A Constitutional Despotism government grants absolute power to its ruler in exchange for the strength to resist outside threats, whether those threats are real or imagined."
gov_ark_theocratic_despotism: "Theocratic Despotism"
gov_ark_theocratic_despotism_desc: "A Theocratic Despotism government is a city-state despotism of spiritualist ideology, where the ruler, as the highest leader of the religious class, governs a nation led by an established state religion."
gov_ark_chosen_tribunal: "Chosen Tribunal"
gov_ark_chosen_tribunal_desc: "The Chosen Tribunal is a city-state despotism of spiritualist ideology, where the ruler selects enforcers, executors and judges by listening to divine oracles as the instruments of governing the nation, restraining the citizenry and answering to them."
gov_ark_military_despotism: "Military Despotism"
gov_ark_military_despotism_desc: "Military despotism is a militarist form of city-state despotism, where the ruler, as unquestionable authority, holds the power of life and death within the nation."
gov_ark_strong_world: "World of the Strong"
gov_ark_strong_world_desc: "The World of the Strong is a militarist form of city-state despotism, where an individual's social status is determined by personal strength and battle record, and only the undefeated strong who have fought countless battles are qualified to rule and lead the nation."
gov_ark_knight_kingdom: "Knight Kingdom"
gov_ark_knight_kingdom_desc: "The Knight Kingdom is a militarist form of city-state despotism, in which only the mightiest knight is considered a qualified despotic leader."
gov_ark_peaceful_despotism: "Peaceful Despotism"
gov_ark_peaceful_despotism_desc: "Peaceful despotism is a peace-loving form of city-state despotism, in which the government is required to protect its law-abiding citizens from violent organizations at home and abroad."
gov_ark_totalitarian_despotism: "Totalitarian Despotism"
gov_ark_totalitarian_despotism_desc: "Totalitarian despotism is a materialist city-state despotism. The state holds absolute authority over society and, in the name of efficiency, seeks to control public and private life."
gov_ark_technocratic_despotism: "Technocratic Despotism"
gov_ark_technocratic_despotism_desc: "Technocratic despotism is a city-state despotism of materialist ideology, in which a technocratic leader fully controls the nation's development in the name of efficiency and scientific research."
gov_ark_killing_empire: "Killing Empire"
gov_ark_killing_empire_desc: "The Killing Empire is a form of city-state despotism developed from fanatically xenophobic ideology, whose ultimate goal is to annihilate all alien species in blood and fire."
gov_ark_business_empire: "Business Empire"
gov_ark_business_empire_desc: "The Business Empire is a special city-state system in which the entire nation is like a vast corporation, and the people, like employees, are supervised by the leadership above."
gov_ark_enlightened_despotism: "Enlightened Despotism"
gov_ark_enlightened_despotism_desc: "This is an enlightened despotic government. In choosing its ruler it places special emphasis on learning and credentials, and holds that the ideal ruler must be just and ceaselessly self-motivated."
gov_ark_evil_city_state: "Evil City-State"
gov_ark_evil_city_state_desc: "This government is organized like a large-scale criminal syndicate, where the weak and any neighboring state are regarded merely as targets to be preyed upon."
RT_DOCTOR: "Doctor"
RT_GRAND_MASTER_FEMALE: "Grand Master"
RT_KNIGHT_KING: "Knight King"
RT_KNIGHT_QUEEN: "Knight Queen"
personality_medical_council: "Knights Hospitaller"
personality_medical_council_desc: "The Knights Hospitaller are highly tolerant of the many things beyond their world, though that does not mean they are willing to grow close to them. They will try to gain profit and knowledge through trade."

## civic ##
civic_business_union: "Commercial Union"
civic_business_union_desc: "A commercial organization formed by the interstellar corporations that dominate society. These corporations take a broad part in governing the nation and profit from the process."
civic_tooltip_business_union_effects: "Gain §Y2§! §YCity-State Enterprise§! civics after the game starts.\n§YCan establish Branch Offices§!"
civic_pharmaceutical_enterprises: "Pharmaceutical Enterprise"
civic_pharmaceutical_enterprises_desc: "Relying on advanced technology and rapidly expanding other businesses, the pharmaceutical group headed by Rhodes Island Pharmaceuticals rose swiftly from the chaotic old world, and the government maintains comprehensive and deep cooperation with private medical groups."
civic_tooltip_pharmaceutical_enterprises_effects: "- Can build the £building£§Y$building_ark_corporate_hospital1$§! series of buildings, providing £job_researcher£§Y$job_researcher$§! and £job_healthcare£§Y$job_healthcare$§! jobs, increasing $TRADE_VALUE$, and raising $MOD_LOGISTIC_GROWTH_MULT$\n- Unlocks the £society£ §YOriginium Biology§! technology required to upgrade the £building£§Y$building_ark_corporate_hospital1$§! series of buildings"
civic_warehousing_logistics_groups: "Warehousing and Logistics Group"
civic_warehousing_logistics_groups_desc: "Penguin Logistics, Fengchi Logistics, Tortoise Express... the names of these warehousing and logistics groups have long been familiar to all. But these giants began as nothing more than small courier and messenger companies that dealt in selling information, armed escort and secret transport, and grew strong step by step through such business."
civic_investment_laboratories: "Investment Laboratories"
civic_investment_laboratories_desc: "Rhine Lab, Volvot Cochinsky, Beachbrella and other top technology companies are now close government partners, dedicated to developing all manner of advanced technology and sparing no effort in promoting their new products to the whole of society."
civic_tooltip_investment_laboratories_effects: ""
civic_security_contractors: "Security Contractors"
civic_security_contractors_desc: "Military service companies led by Blacksteel Worldwide are now widely known. As the government's security contractors, these companies can rapidly provide fully organized combat units when necessary."
civic_industry_manufacturers: "Industrial Manufacturers"
civic_industry_manufacturers_desc: "With the arrival of the space age, manufacturing companies led by Raythean have relied on their rich heritage to establish themselves as the leader of the military industry sector."
civic_circulation_business: "Circulation Business"
civic_circulation_business_desc: "Since entering the Crystal Age, this civilization's civilian commerce has flourished. Today, large private enterprises focused on food, clothing and luxury goods, such as Chao-Lung Mountain, are thriving even more."
civic_union_summit: "Union Summit"
civic_union_summit_desc: "Formerly the Summit of All Nations held by Laterano, it has been widely adopted by nations as a channel for handling international disputes and cooperation. It has since gradually evolved into a council system through which the various regions of the civilization express their demands."
civic_tooltip_union_summit_effects: "Gain §Y2§! §Ynon-City-State Enterprise§! civics after the game starts.\t\t"
civic_medical_welfare: "Medical Welfare"
civic_medical_welfare_desc: "A healthy citizenry is the foundation of a nation's prosperity and stability. Relying on biotechnology, advanced medicine and a complete medical welfare system, this society ensures that every citizen can enjoy healthcare services, driving the empire's all-round prosperity and progress."
civic_tooltip_medical_welfare_effects: "- Can build the £building£§Y$building_ark_hospital1$§! series of buildings, providing £job_researcher£§Y$job_researcher$§! and £job_healthcare£§Y$job_healthcare$§! jobs, increasing the £society_research£$society_research$ produced by £job£ jobs, and raising $MOD_LOGISTIC_GROWTH_MULT$\n- Unlocks the £society£ §YOriginium Biology§! technology required to upgrade the £building£§Y$building_ark_hospital1$§! series of buildings"
civic_messenger_network: "Messenger Network"
civic_messenger_network_desc: "The Messenger Network evolved from the volunteer organization of Catastrophe Messengers dedicated to disaster prevention and information exchange, and is now a public security force. To keep civilization safe from disaster, they do not hesitate to venture deep into treacherous mists and dangerous alien worlds."
civic_tooltip_messenger_network_effects: ""
civic_security_services: "Security Services"
civic_security_services_desc: "A centralized, ruthless yet effective security apparatus protects the whole of society from threats internal and external."
civic_tooltip_security_services_effects: ""
civic_holy_notarial_hall: "Holy Notarial Hall"
civic_holy_notarial_hall_desc: "This society cannot function without the grassroots civil servants of the Notarial Hall. The Hall levies fees from citizens, urges them to fulfill all kinds of legal obligations, and provides various services to safeguard their rights and interests."
civic_tooltip_holy_notarial_hall_effects: ""
civic_chivalry: "Chivalry"
civic_chivalry_desc: "As the times have changed, knighthood has gradually turned from a title of status into a profession, but the spirit of chivalry has sunk deep into every corner of society."
civic_tooltip_chivalry_effects: "Our §YFleet Commanders§! and §YArmy Generals§! will receive the §GChivalry§! trait after recruitment."
civic_tooltip_deities_in_world_effects: "Start the game with a group of special §HLeaders§!."
civic_heavy_taxation: "Heavy Taxation"
civic_heavy_taxation_desc: "Citizens must devote themselves wholeheartedly. Heavy taxes are the due return citizens make to society, and a powerful driving force for individual advancement."
civic_tooltip_heavy_taxation_effects: ""
