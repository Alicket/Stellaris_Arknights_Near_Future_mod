#### Rhodes Island ####
ark_rhodes_island.2.name: "Rhodes Island Leadership Office"
ark_rhodes_island.2.a.desc: "§GAmiya§!\n\nDoctor, thank you for your hard work."
ark_rhodes_island.2.b.desc: "§GAmiya§!\n\nDoctor Kal'tsit taught me that I must stay fully focused while working... Yes, fully focused."
ark_rhodes_island.2.c.desc: "§GAmiya§!\n\nAs the leader of Rhodes Island, there are still many ways in which I am immature. I hope you can point me further in the direction we should take."
ark_rhodes_island.2.d.desc: "§GAmiya§!\n\nDoctor, I am so glad... to see you again. We still have a long road to walk together, so please look after me!"
ark_rhodes_island.2.a: "Joint Council"
ark_rhodes_island.2.a_tooltip: "The Joint Council is the body that decides policy together with the leaders of each region."
ark_rhodes_island.2.b: "Archive Center"
ark_rhodes_island.2.b_tooltip: "Important records and accounts concerning the civilization of Terra."
#ark_rhodes_island.2.c: "Human Resources"
#ark_rhodes_island.2.c_tooltip: "[Root.GetName]'s institution for training outstanding talent."
ark_rhodes_island.2.c: "Reset Doctor Portrait"
ark_rhodes_island.2.c_tooltip: "Immediately change the portrait of the Doctor (the ruler you set at game start) to the hooded figure. Has no effect if the Doctor does not exist."
ark_rhodes_island.3.c: "Reset Kristen's Portrait"
ark_rhodes_island.3.c_tooltip: "Immediately reset Kristen's portrait. Has no effect if Kristen does not exist."
ark_rhodes_island.2.g: "Glad to see you, Amiya."
ark_rhodes_island.2.h: "Reset Leader Portraits"
ark_rhodes_island.2.h_tooltip: "Reset the portraits of all special leaders | Excludes leaders not yet recruited from the leader pool | Unavailable after Synthetic Evolution | §YPortrait updates in new versions of Stellaris may lag; if nothing changes right after choosing this option, please reload the save to update§!"
ark_rhodes_island.2.h_tooltip2: "Unavailable after Synthetic Evolution"
ark_rhodes_island.3.name: "Joint Council"
ark_rhodes_island.3.1.desc: "§GAmiya§!\n\nThe Joint Council is the highest authority of the United Terra. An important administrative session is held every 5 years. You may propose one of the motions raised at the session as a short-term national policy for the next 5 years. If the Doctor says nothing, the Council will decide on its own. Please note:\n\n§GGreen§! marks excellent motions broadly endorsed by Council representatives.\n§YYellow§! marks expert motions of a higher professional level.\n§RRed§! marks motions that are highly contested, with many abstentions.\n§3Orange§! marks special motions that will have a major impact on Terra's future development."
ark_rhodes_island.3.2.desc: "§GAmiya§!\n\nDoctor, an important administrative session of the Joint Council is now in progress! You may propose one of the motions raised at the session as a short-term national policy for the next 5 years. If the Doctor says nothing, the Council will decide on its own. Please note:\n\n§GGreen§! marks excellent motions broadly endorsed by Council representatives.\n§YYellow§! marks expert motions of a higher professional level.\n§RRed§! marks motions that are highly contested, with many abstentions.\n§3Orange§! marks special motions that will have a major impact on Terra's future development."
ark_rhodes_island.3.3.desc: "§GAmiya§!\n\nDoctor, an emergency session of the Joint Council is now in progress, and most of the motions will take part in the Council's final discussion! You may propose one of them as a short-term national policy for the next 5 years. If the Doctor says nothing, the Council will decide on its own. Please note:\n\n§GGreen§! marks excellent motions broadly endorsed by Council representatives.\n§YYellow§! marks expert motions of a higher professional level.\n§RRed§! marks motions that are highly contested, with many abstentions.\n§3Orange§! marks special motions that will have a major impact on Terra's future development."
ark_rhodes_island.3.4.desc: "§GAmiya§!\n\nDoctor, we have lost control of [Root.Capital.GetName]! The foundation of the Council has been shattered, and the joint session may well be unable to convene!"
ark_rhodes_island.3.g1: "§GSpiritual World Development§!"
ark_rhodes_island.3.g1_tooltip: "Spiritual pillars and spiritual drive are the soul of our march into the stars."
ark_rhodes_island.3.g2: "§GMaterial World Development§!"
ark_rhodes_island.3.g2_tooltip: "Progress in material production is the foundation and prerequisite of our exploration of the infinite."
ark_rhodes_island.3.g3: "§GHigh-End Equipment Manufacturing Support§!"
ark_rhodes_island.3.g3_tooltip: "Development in high-end fields determines the overall competitiveness of a civilization's industry."
ark_rhodes_island.3.g4: "§GStrategic Resource Industry Support§!"
ark_rhodes_island.3.g4_tooltip: "The only way to prevent strategic resources from becoming a threat is to keep them in our own hands."
ark_rhodes_island.3.g5: "§GRegional Tax Exemption Policy§!"
ark_rhodes_island.3.g5_tooltip: "For purposes such as revitalizing the economy or post-disaster support, some regions enjoy tax exemption for a certain period of time."
ark_rhodes_island.3.g6: "§GEmployment Guidance Subsidy§!"
ark_rhodes_island.3.g6_tooltip: "Citizens of the interstellar age should not be blocked by difficulty in choosing a career."
ark_rhodes_island.3.y1_1: "§3A Land of Order I§!"
ark_rhodes_island.3.y1_2: "§3A Land of Order II§!"
ark_rhodes_island.3.y1_3: "§3A Land of Order III§!"
ark_rhodes_island.3.y1_4: "§3A Land of Order IV§!"
ark_rhodes_island.3.y1_tooltip: "Law ought to be built upon the physical and spiritual needs of all people. This is a promise to every resident of this land.\n§gWill reduce the negative effects across Terra.§!"
ark_rhodes_island.3.y2: "§YIntelligent Machinery Support§!"
ark_rhodes_island.3.y2_tooltip: "Efficient intelligent machinery will extend the reach of human activity and capability."
ark_rhodes_island.3.y3: "§YPlanetary Defense Directive§!"
ark_rhodes_island.3.y3_tooltip: "Prepare for a war of attrition against threats from space."
ark_rhodes_island.3.y4: "§YCity-State Development Plan§!"
ark_rhodes_island.3.y4_tooltip: "The rise of urbanization symbolizes the development and progress of civilization."
ark_rhodes_island.3.y5: "§YSpace Fleet Construction§!"
ark_rhodes_island.3.y5_tooltip: "The number of warships determines the distance between the alien threat and us."
ark_rhodes_island.3.y6: "§YExploration and Discovery Program§!"
ark_rhodes_island.3.y6_tooltip: "Explore the unknown mysteries of the homeworld and the ancient legends of every race.\n§LThe effects of this project are unknown.§!"
ark_rhodes_island.3.r1: "§RTerra United Search Warrant§!"
ark_rhodes_island.3.r1_tooltip: "Search out and suppress the remnants of the old world that resist to the bitter end."
ark_rhodes_island.3.v: "Convene an Emergency Session"
ark_rhodes_island.3.v_tooltip: "Spend additional influence to convene an emergency session at which most motions can be decided."
ark_rhodes_island.3.w: "Confirm"
ark_rhodes_island.3.x: "Abstain"
ark_rhodes_island.4.name: "Rhodes Island Human Resources"
ark_rhodes_island.4.desc: "§GOrchid§!\n\nRhodes Island Human Resources trains the finest talent in all of [Root.GetName] and draws up their development plans. You may start a training program here, and when it concludes you will meet the best of the best in [Root.GetName]."
ark_rhodes_island.4.a: "Peak Plan"
ark_rhodes_island.4.b: "Exit"
ark_rhodes_island.41.desc: "§GOrchid§!\n\nOperation Peak is an elite 5-year development program. When the 5-year period ends, you will receive several powerful leaders from that graduating class."
ark_rhodes_island.41.a: "Launch Operation Peak"
ark_rhodes_island.41.b: "Let me think about it"
ark_rhodes_island.41.c: "Exit"
ark_rhodes_island.4111.name: "Operation Peak Concludes"
ark_rhodes_island.4111.desc: "The 5-year §BOperation Peak§! has ended! The §B2§! graduates of this class have reported to Human Resources. Do you still remember them?"
ark_rhodes_island.5.name: "Archive Center"
ark_rhodes_island.5.a.desc: "§GPtilopsis§!\n\nHello, Doctor. How may I help you?"
ark_rhodes_island.5.b.desc: "§GPtilopsis§!\n\nReading software package list... application complete."
ark_rhodes_island.5.c.desc: "§GPtilopsis§!\n\nFormerly a data maintenance officer at Rhine Lab. If it is convenient, please use the command line to complete the operation you require."
ark_rhodes_island.5.d.desc: "§GPtilopsis§!\n\nA brand new day. Doctor online detected. Ptilopsis's mood index is rising."
ark_rhodes_island.5.a: "Archive: Catastrophes"
ark_rhodes_island.5.b: "Archive: Originium"
ark_rhodes_island.5.c: "Archive: Originium Arts"
ark_rhodes_island.5.d: "Archive: Oripathy / The Infected"
ark_rhodes_island.5.e: "Archive: Nomadic Cities"
ark_rhodes_island.51.desc: "§RCatastrophes§!\n\n§LThe collective name for the various natural disasters that occur frequently in the world of Terra, including but not limited to storms, blizzards, heavy rainfall, floods and even meteor strikes. Catastrophes occur very often, and their patterns are hard to grasp, which leads most civilizations to avoid them by migrating whole cities. After a Catastrophe passes, a mineral called Originium is often left behind. Research suggests that Catastrophes may in fact be one of Originium's vectors of spread.§!\n\nEven into the interstellar age, Catastrophes remain the primary factor threatening the survival of every civilization and race on Terra. As technology advanced, the Terrans gradually created more means of resisting Catastrophes, such as city shock-absorbing systems and weather-control units, yet Catastrophes can still easily destroy new nomadic cities that face their full might. In addition, Catastrophes and the harsh climate they bring also affect transport through Terra's planetary customs, and the heavy loss of life and property they cause happens again and again and is hard to avoid entirely.\nAs the theory of the new world has matured, we have confirmed that to Terra a Catastrophe is merely an anomalous phenomenon of a living planet."
ark_rhodes_island.52.desc: "§YOriginium§!\n\n§LA mineral commonly found in the world of Terra, mostly in the form of black, semi-translucent crystals. All Originium contains immense energy, and it is the primary cause of Catastrophes. It is commonly used in the field of Arts, and is the basic material and catalyst for making all kinds of Arts tools and implements; without the aid of Originium, the efficiency of using Arts drops sharply. Today, with the renewal of Originium engines, more and more Originium is used as an energy source by various nations. The land is ravaged by Catastrophes of unknown cause, and on the lands swept by them a great deal of a mysterious mineral appears: \"Originium\". Relying on technological progress, the energy contained in Originium was put into industry, letting civilization enter the modern age smoothly, while Originium itself also gave rise to the existence of the \"Infected\".§!\n\nFor hundreds of years, scientists in every historical period have never stopped researching and exploring this mysterious substance that contains immense energy. Any research results of ours concerning Originium will grant a certain amount of £engineering_research£$engineering_research$. In addition, because the special nature of Terra's world has been proven, Originium can only be extracted locally on Terra."
ark_rhodes_island.53.desc: "§YOriginium Arts§!\n\n§LAfter Originium was discovered, people developed a technology through which it is used to cast a series of effects that change the original properties of matter. This technology is called Originium Arts, commonly known as \"Arts\". The energy used by Originium Arts is generally believed to come from Originium itself. Whether a person can use Arts, and the form, strength and effects of the Arts they can use, are usually constrained by two factors: innate qualities, and the ability to learn Originium Arts afterwards.§!"
ark_rhodes_island.54.desc: "§ROripathy§!\n\n§LLong-term contact with Originium and its industrial derivatives has been found to make people more susceptible to an incurable disease called \"Oripathy\". Those who contract Oripathy are called the \"Infected\". Oripathy enhances a person's ability to use Arts in a dangerous way, but as the patient uses Arts the infection spreads further, eventually taking the Infected's life and turning them into a new source of infection. There has long been research on the disease from many quarters, yet without much effective result.§!\n\n§RThe Infected§!\n§LThose infected by Originium. The theoretical fatality rate is 100%, and at death they carry the capacity to spread infection and a potential for danger, which makes them targets of quarantine and expulsion in every nation. For a very long time, no one has told them how to live out the rest of their lives.§!\n\nBeyond the highly destructive Catastrophes, Oripathy's Infected are a similarly serious problem that is often overlooked. Lacking truly effective treatment, the inevitable appearance of the Infected and their deaths significantly affect the social stability of Terra's civilizations. Every §R15 years§!, Terra's civilizations lose roughly §R1§! working population to infection.\n\nAny research results of ours concerning Oripathy will grant a certain amount of £society_research£$society_research$."
ark_rhodes_island.55.desc: "§BNomadic Cities§!\n\n§LCities built on mobile equipment. Destructive and frequent Catastrophes have forced almost every nation to regularly migrate whole cities to evade them. The invention of the Originium engine made Originium industrialization possible, and people began to try to build vehicles far larger than before. The scale of vehicles has long since surpassed the past, eventually forming the concept of the nomadic city. Together with multi-channel Catastrophe forecasting systems, cities usually need to allow 2-8 weeks to ensure a safe evacuation out of a disaster's reach, depending on the disaster. Not all cities are nomadic cities: in regions with fewer Catastrophes, such as Kjerag, there are still settlers.§!"
ark_rhodes_island.52.a: "Entry One"
ark_rhodes_island.52.b: "Entry Two"
ark_rhodes_island.52.c: "Entry Three"
ark_rhodes_island.52.d: "Entry Four"
ark_rhodes_island.521.desc: "§GOriginium Research Brief 1§!\n\n§LOriginium is an extremely excellent renewable clean energy source, and choosing it as the pillar of Terra's energy structure is reasonable and wise.§!\n\n£originiums£$originiums$ as an energy source is excellent. It is easy to mine, convenient to store, simple to transport, safe and non-toxic, free of environmental pollution, high in energy density and extremely abundant in reserves. If we set aside the two hazards - that \"Originium may cause Catastrophes\" and that \"Originium may cause Oripathy\" - which are not part of the current criteria for judging energy superiority, Originium is an ideal renewable clean energy. Compared with the greenhouse effect worsened by fossil fuels, global warming, and the resulting rise in sea levels by several meters within a century that will submerge a fair number of coastal cities, the threat of Originium causing Catastrophes is almost negligible with the help of nomadic cities. And compared with the acute leukemia caused by radiation leaks from nuclear reactors, the threat that Originium may cause Oripathy is not that frightening either. In other words, as long as protective measures are in place, the dangers of Originium can be avoided. And the outstanding energy properties of Originium itself mean that no far-sighted ruler with insight would lightly give it up. That is to say, Terra's choice of Originium as the pillar of its energy structure is not only proper but highly wise.\n\n§BResearch Specialist Platenous_Frost\nUID407843750§!"
ark_rhodes_island.522.desc: "§GOriginium Research Brief 2§!\n\n§LThe industrial system of Terra's world is an \"Originium industrial system\" with \"Originium Arts\" as its technical guide, whose technical pillar is \"Originium materials science\" rather than the \"materials science\" of natural science.§!\n\nTerra's industrial system is mainly an \"Originium industrial system\" centered on the industrial derivatives of \"Originium\" such as \"Orirock\" and \"Orirock Cube\", with other materials as auxiliaries. In this system, whether raw materials, processing, or finished products, \"Originium\" and the \"Originium Arts\" derived from it are always present. This reveals the essence of an industrial system centered on and based on Originium: it is not an industrial system guided by \"science\", but one guided by \"Originium Arts\". In such an industrial system, the technical pillar should be \"Originium materials science\", that is, using Originium Arts to directly drive chemical reactions, affecting matter at the molecular level, and with Originium itself as raw material, ultimately producing the materials required by \"Originium Arts\".\n\n§BResearch Specialist Platenous_Frost\nUID407843750§!"
ark_rhodes_island.523.desc: "§GOriginium Research Brief 3§!\n\n§LOriginium exhibits the properties of a pure substance, and may be a simple substance composed of a single element.§!\n\nBased on the purification of Orirock Concentration, it is initially inferred that \"Originium\" is not a mixture but a pure substance that can be purified.\nSo far, Originium does not show the characteristics of acid, base, salt or metal oxide among inorganic compounds. If Originium were a compound, the high temperatures a \"Catastrophe\" may produce would inevitably break its chemical bonds - yet in fact this does not happen; instead large amounts of Originium are produced and form ore veins. Unlike those chemical reactions that absorb heat at high temperatures, all current evidence indicates that Originium cannot be synthesized - otherwise one would only need to simulate Catastrophe conditions on a small, artificial scale to synthesize great amounts of Originium, yet no material proving that approach feasible has been found.\nTherefore, unless the chemical bonds of Originium can re-form while releasing heat after breaking endothermically, Originium can only be a simple substance. As a simple substance, Originium must be composed of a single element, which means it cannot form naturally through chemical reactions.\n\n§BResearch Specialist Platenous_Frost\nUID407843750§!"
ark_rhodes_island.524.desc: "§GOriginium Research Brief 4§!\n\n§LOriginium does not obey the laws of natural science and is very likely a supernatural product.§!\n\nBy observing with electron microscopy the images of \"Originium proliferation within the bodies of Oripathy patients\", we have confirmed that the proliferation of Originium in the Infected resembles the medical process of \"fibrosis\". That means Originium can proliferate naturally within the human body - the appearance of a simple substance out of nothing. But to produce a simple substance, one element must be converted into another - that is a nuclear reaction, which means the generation of Originium must release energy comparable to a nuclear bomb of the same volume, and that is obviously impossible.\nIn summary, by reductio ad absurdum, we can preliminarily confirm that Originium does not obey scientific laws and is very likely a supernatural product.\n\n§BResearch Specialist Platenous_Frost\nUID407843750§!"
ark_rhodes_island.541.desc: "§GOripathy Research Brief 1§!\n\nOripathy stems from Originium, the source of all suffering and all prosperity. This thing, which possesses at least four properties - energy substance, industrial raw material, pathogen of an infectious disease, and medium of the occult - has cut off every possibility of easily analyzing its essence with its complexity and strangeness. But if we set aside Originium's properties in the fields of energy, materials and the supernatural, set aside all the imagery heaped upon it, and consider it merely as a pathogen, can we arrive at a satisfactory result?\n\n§BResearch Specialist Propranolol\nUID183955511§!"
ark_rhodes_island.542.desc: "§GOripathy Research Brief 2§!\n\n§GKnown findings of Oripathy research§!\n§Y1 Pathogen§! Originium is a unique substance; it is not any kind of bacterium, fungus or virus, and appears fibrous under electron microscopy.\n§Y2 The Uninfected§! The blood of uninfected, normal people contains trace amounts of Originium crystals.\n§Y3 Transmission, self-replication and pathology§! According to Rhodes Island operator files and related records, most of the Infected contracted Oripathy through close contact with Originium; Originium replicates itself by fusing with somatic cells; tissues infected by Originium develop lesions (imaging monitoring of the Infected always shows blurred organ outlines and abnormal shadows) and functional abnormalities.\n§Y4 Immune system response§! In the clinical diagnostic analysis of Oripathy, the diagnostic basis is not the presence or absence of an immune response, but imaging results, the somatic cell-Originium fusion rate, and blood Originium crystal density. No record of inflammation caused by Oripathy has been found in any Infected's file.\n\n§BResearch Specialist Propranolol\nUID183955511§!"
ark_rhodes_island.543.desc: "§GOripathy Research Brief 3§!\n\nOriginium takes part extensively in the cellular composition of the vast majority of Terrans, save for the deep-sea race. On our cell membranes, Originium crystals form a substance known as Originium pseudoprotein. Specifically, Originium pseudoprotein not only shares important cellular life activities with membrane proteins, but also gives Terrans an ability the deep-sea race lacks: Originium Arts. Therefore, for the vast majority of Terrans, a suitable amount of Originium crystals in the blood is in fact a trace substance necessary for survival, and also the raw material for synthesizing Originium pseudoprotein.\n\n§BResearch Specialist Propranolol\nUID183955511§!"
ark_rhodes_island.544.desc: "§GOripathy Research Brief 4§!\n\nHigh-purity Originium crystals produced by artificial processing or formed under natural conditions are a kind of Originium polymer different from Originium pseudoprotein. Their relationship and difference are like those of a prion and cellular prion protein: the two are chemically identical, yet have completely different physical and chemical properties. When pathogenic Originium crystals come into direct contact with the body tissue of a healthy person, they induce the Originium pseudoprotein on the tissue cells to transform into pathogenic Originium crystals, just as a prion can convert the structure of cellular prion protein into its own structure. This process is called the fusion of Originium and somatic cells. Because of the structural change, most of the functions of the Originium pseudoprotein itself are either lost or weakened to varying degrees, and the only benefit such a change may bring is the improvement of Originium Arts adaptability caused by the appearance of pathogenic Originium crystals, or favorable mutations induced thereby.\n\n§BResearch Specialist Propranolol\nUID183955511§!"
ark_rhodes_island.545.desc: "§GOripathy Research Brief 5§!\n\nThe somatic cells first infected by pathogenic Originium crystals are the frontline base from which Oripathy expands its field of infection. On the one hand they assimilate the Originium pseudoprotein on normal cells around the infected somatic cells; on the other hand they spread through the body's circulatory system to other organs, causing multiple lesions in the Infected's body. Some pathogenic Originium crystals transformed from Originium pseudoprotein leave the cell they originally belonged to, gather together and deposit on the body surface, forming the typical characteristic of Oripathy patients: surface Originium crystals. The ultimate cause of death for the Infected may be organ failure caused by the proliferation of pathogenic Originium crystals, or complications contracted during the infection.\n\nFacing the vast world of Terra, still not fully revealed, we must keep our minds open.\n\n§BResearch Specialist Propranolol\nUID183955511§!"
