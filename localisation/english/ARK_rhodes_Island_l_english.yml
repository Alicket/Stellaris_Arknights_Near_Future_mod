ark_rhodes_island.4111.a: "Glad to see you again"
ark_rhodes_island.301.name: "A Land of Order: Storm and Darkness"
ark_rhodes_island.301.desc: "Catastrophes run wild and bandits roam at will. This land lacks order, yet it does not lack life. The people living on this land ignore the law and risk everything for petty gain, and fall quietly to hunger, cold and plague, at last known to no one.\nJudged by quality of life and the caliber of its population, they are still far from qualified interstellar citizens, and it is unacceptable to deliberately forget them and maintain this false \"stability\"."
ark_rhodes_island.301.a: "Confirm"
ark_rhodes_island.302.name: "A Land of Order: First Steps"
ark_rhodes_island.302.desc: "Light a fire in the fog of hostility and ignorance, and burn a path forward onto the land of suffering. Every demi-human tribe living on this land is a part of the road of civilization that cannot be cast aside."
ark_rhodes_island.303.name: "A Land of Order: Strewn with Thorns"
ark_rhodes_island.303.desc: "The sinews of law grow across the barren land, and the self-regulating social rules of human civilization wage a silent struggle against the irresistible Catastrophes and the deep-rooted ignorance and evil."
ark_rhodes_island.304.name: "A Land of Order: Autumn Splendor"
ark_rhodes_island.304.desc: "The lights of civilization are not confined to the city-states; the corners of the wilderness are places the sunlight can reach too. This is a victory of ours over ruthless nature and the bitter old era; at least for now, people will be grateful for the heroes who devoted themselves to saving them and holding fast to the right path."

land_of_order_pop: "A group of land dwellers outside society will be recognized as citizens of the empire and accepted by civilization."

