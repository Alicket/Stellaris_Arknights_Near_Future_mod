ark_mod_check.1.name:0 "Arknights mod conflict warning"
ark_mod_check.1.desc:0 "It appears you have installed §B[Arknights]Near Future§! and §B[Arknights]The Crusade to Stellaris§! at the same time. To avoid §Rbugs and crashes§! caused by mod settings and storyline conflicts, it is highly recommended to disable one of them for a better gaming experience. Sorry for the inconvenience and thank you for your understanding."
ark_mod_check.1.a:0 "Confirm"
ark_mod_check.3.name:0 "Originium Mining"
ark_mod_check.3.desc:0 "In the production and wars to come, you will need a large amount of ['concept_originiums']. Below are all the ways to ['concept_excavate_originiums']:\n- There is a small amount of naturally occurring Originium on Terra and Terra-IX.\n- You have just finished researching £engineering_research£§Y$tech_mineral_purification_1$§!, and can now build £building£§Y$building_originiums_mining_plant_1$§! and its further upgrades in Terra's mining district specialization building slots to produce large amounts of Originium. This is also the main way of acquiring it.\n- Freezing planets with the Colossus weapon £engineering_research£§Y$PLANET_KILLER_ARK_FROSTNOVA$§! produces a very small amount of Originium."
