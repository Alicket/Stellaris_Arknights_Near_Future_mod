ARK_MASS_SENSING_AMMO:0 "Mass-Sensing Shell"
ARK_MASS_SENSING_AMMO_DESC:0 "The sensors built into this special shell can detect the gravitational fluctuations of hostile ships, providing a bonus to accuracy."
ARK_ARMOR_1:0 "D32 Steel Homogeneous Armor"
ARK_ARMOR_1_DESC:0 "Ship armor manufactured from a single grade of D32 Steel, providing reliable protection."
ARK_ARMOR_2:0 "D32 Steel Composite Armor"
ARK_ARMOR_2_DESC:0 "Using new manufacturing techniques, this composite armor plate combines multiple materials on the inner and outer layers of D32 Steel."
ARK_ARMOR_3:0 "Carbon Fiber Armor"
ARK_ARMOR_3_DESC:0 "A new type of armor forged from D32 Steel composites and high-quality carbon materials. It offers high strength, low density, high-temperature resistance and corrosion resistance."
ARK_ARMOR_4A:0 "Gel Self-Repairing Armor"
ARK_ARMOR_4A_DESC:0 "Intelligent armor filled with a special polymer gel. It combines extreme strength and temperature resistance with plasticity, and can slowly repair its own damage."
ARK_ARMOR_4B:0 "Superconducting Self-Repairing Armor"
ARK_ARMOR_4B_DESC:0 "Intelligent armor that repairs armor points faster by draining power, greatly improving a ship's combat endurance."
ARK_SHIELD_1:0 "Knight Shield"
ARK_SHIELD_1_DESC:0 "A shield originally used by competitive knights, whose later improved models are commonly equipped by many nations. Despite its low cost and ease of mass production, it still suffers from the old problem of poor heat dissipation."
ARK_SHIELD_2:0 "Arts Shield"
ARK_SHIELD_2_DESC:0 "A ship energy barrier manufactured according to the principles of Originium Arts."
ARK_SHIELD_3:0 "Iron Guard Shield"
ARK_SHIELD_3_DESC:0 "An energy barrier reinforced with Arts, giving ships the protection of a high-resistance shield."
ARK_SHIELD_4A:0 "Advanced Arts Shield"
ARK_SHIELD_4A_DESC:0 "Improved Arts circuits and upgraded energy field confinement allow the new energy barrier to provide superior protection."
ARK_SHIELD_4B:0 "Super Arts Shield"
ARK_SHIELD_4B_DESC:0 "The strongest energy shield that general-purpose Arts can theoretically achieve."
ARK_SHIELD_5A:0 "Sanctuary Shield"
ARK_SHIELD_5A_DESC:0 "A defense-enhanced shield designed based on special Originium Arts. Within this energy field, the molecular structure of armor metal is stabilized."
ARK_SHIELD_5B:0 "Sanctuary Aegis"
ARK_SHIELD_5B_DESC:0 "An Arts deflection barrier manufactured with special Originium Arts, capable of deflecting projectiles."
ARK_SHIELD_5C:0 "Ironclad Shield"
ARK_SHIELD_5C_DESC:0 "A shield forged through secret technology that contains the power of a god, capable of withstanding incredible firepower. Traces of biotechnology seem to remain within it..."
