l_english:

ARK_LASER_1:0 "Arts Laser Cannon"
ARK_LASER_1_DESC:0 "A high-energy Arts laser cannon fired by an Originium energy device. It deals considerable damage to ships at long range."
ARK_LASER_2:0 "Focused Arts Laser Cannon"
ARK_LASER_2_DESC:0 "A focused, high-energy Arts laser cannon fired by an Originium energy device. It deals massive damage to ships at long range."
ARK_POLYMER:0 "Arts Cannon"
ARK_POLYMER_DESC:0 "A destructive mass of condensed Arts launched by an Arts generation device."
ARK_DISRUPTOR_1_1:0 "Luminous Disruptor"
ARK_DISRUPTOR_1_1_DESC:0 "A disruptor weapon built by imitating the might of legendary gods. It rapidly dissolves ship shields."
ARK_DISRUPTOR_2_1:0 "Umbral Disruptor"
ARK_DISRUPTOR_2_1_DESC:0 "A disruptor weapon built by imitating the might of legendary gods. It rapidly corrodes ship armor."
ARK_POINT_DEFENCE:0 "Arts Point-Defense Cannon"
ARK_POINT_DEFENCE_DESC:0 "A point-defense system built around hybrid Arts. Against incoming targets, it automatically selects the damage type best suited to their shields and armor."
ARK_ENERGY_TORPEDO_1:0 "Quantum Firecracker - Sui"
ARK_ENERGY_TORPEDO_1_DESC:0 "An energy projectile that unleashes its might through an annihilation effect. The damage it deals to a target may end up lower than expected due to decay."
ARK_MISSILE_1:0 "Quantum Firecracker"
ARK_MISSILE_1_DESC:0 "A long-range missile built with technology shared by a god. It deals massive damage to its target and is far more stable.\n§L- If you didn't hear the explosion, then it never existed.§!"
ARK_MISSILE_2:0 "Improved Quantum Firecracker"
ARK_MISSILE_2_DESC:0 "An improved model of the Quantum Firecracker with greater range and a higher damage ceiling.\n§L- Eight chi tall and three and a half chi wide, detonated with a material the like of which has never been seen in all of Terra!§!"
ARK_MASS_ACCELERATOR_1:0 "Originium Heavy Cannon"
ARK_MASS_ACCELERATOR_1_DESC:0 "An Originium-powered mass accelerator cannon. It can only be mounted on a spinal mount."
ARK_MASS_ACCELERATOR_2:0 "Originium Macro Cannon"
ARK_MASS_ACCELERATOR_2_DESC:0 "An Originium-powered mass accelerator cannon with two acceleration rails. It can only be mounted on a spinal mount."
ARK_LOVRO_TRANSDUCER_1:0 "Lovro Kinetic-Thermal Transducer (Resonance Warhead)"
ARK_LOVRO_TRANSDUCER_1_DESC:0 "A Lovro transducer that fires specially designed warheads, converting reactor heat directly into kinetic energy to give the warhead unimaginable speed. Armor penetration is poor, but the resonance warhead's built-in system automatically tunes itself to the frequency of an enemy ship's shields, overloading the target's power grid with extreme efficiency. It has the longest range and the highest projectile speed in the series, ensuring it can be the first to tear open the enemy's outer layer of defense."
ARK_LOVRO_TRANSDUCER_2:0 "Lovro Kinetic-Thermal Transducer (Armor-Shattering Warhead)"
ARK_LOVRO_TRANSDUCER_2_DESC:0 "A Lovro transducer that fires specially designed warheads, converting reactor heat directly into kinetic energy to give the warhead unimaginable speed. The warhead automatically seeks a suitable angle to pierce the enemy ship's armor, detonating inside and eroding the joint between armor and hull so that large areas of armor peel away, avoiding a head-on contest with hard plating. It has the second-longest range and the second-highest projectile speed in the series, ensuring it can pry open the hard shell after the resonance warhead overloads the enemy's power grid."
ARK_LOVRO_TRANSDUCER_3:0 "Lovro Kinetic-Thermal Transducer (Collapse Warhead)"
ARK_LOVRO_TRANSDUCER_3_DESC:0 "A Lovro transducer that fires specially designed warheads, converting reactor heat directly into kinetic energy to give the warhead unimaginable speed. Its outstanding area destruction and excellent tracking reduce any ship that dares to face it, and everything around it, to dust, but at a high cost: it even requires precious dimensional fluid as its charge. Thanks to its special warhead casing, even when dimensional fluid supplies run short, it can still achieve solid overall performance with its normal shield and armor efficiency."
ARK_LOVRO_TRANSDUCER_3_FLEET_EFFECT: "-\tEach hit on a target consumes §R1§! $ark_dimensional_fluid_warhead$. If the $ark_dimensional_fluid_warhead$ stockpile is below the configured value, only the weapon's displayed damage is dealt. If the stockpile is above the insurance value, it deals an additional §G200-500§! true damage and can also deal collateral damage.\n-\t§YCollateral damage:§! Deals §G100§! true damage to all ships within §G50§! of the target.\n-\tEach successful collateral hit consumes §R0.02§! $ark_dimensional_fluid$. If the stockpile is below the insurance value, collateral damage is canceled.\n§g-\tThe insurance value can be configured in §vCommunications - Rhodes Island§!.§!"



ARK_BOOSTER:0 "Originium Fluctuation Booster"
ARK_BOOSTER_DESC:0 "Creates a subspace and induces an extremely strong periodic Originium reaction within it. This strengthens the ship's energy supply and firepower, but affects its structural integrity."
ARK_SPACE_ORIGINIUM_REACTOR:0 "Originium Fluctuation Reactor"
ARK_SPACE_ORIGINIUM_REACTOR_DESC:0 "Creates a subspace and induces an extremely strong periodic Originium reaction within it, providing the ship with a constant supply of energy at the cost of structural instability."
TECH_UNLOCK_ARK_SPACE_ORIGINIUM_POWER_TITLE:0 "§HUnlocks Component:§! $ARK_SPACE_ORIGINIUM_REACTOR$"
TECH_UNLOCK_ARK_SPACE_ORIGINIUM_POWER_DESC:0 "§H$ARK_SPACE_ORIGINIUM_REACTOR$§!\n$ARK_SPACE_ORIGINIUM_REACTOR_DESC$"
