ARK_STRIKE_CRAFT_UAV_1_SET_DESC:0 "A deep-space combat drone that is not particularly advanced, but its low cost means its numbers alone pose a considerable threat to the enemy."
ARK_STRIKE_CRAFT_UAV_2_SET_DESC:0 "An upgraded version of the light swarm fighter, fitted with a more complete autonomous piloting AI as well as more advanced weapon and defense systems."
ARK_STRIKE_CRAFT_FRIGHTER_1_SET_DESC:0 "A heavy unmanned bomber almost the size of a small frigate. It carries a single super-heavy Originium energy bomb with devastating destructive power. After the attack, its only remaining task is to overload the enemy's point-defense systems."


