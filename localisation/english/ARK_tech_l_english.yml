tech_ark_uav_1_desc:0 "When we discovered that even the finest space force soldiers could not make up for what our existing strike craft lacked in the face of space combat in a new era, researchers suggested that we refer to the drone swarm tactics commonly used by the Terran Army in the pre-space Crystal Age and develop a new type of strike craft specialized in swarm combat as an option."
tech_ark_uav_2_desc:0 "After a long period of swarm-tactic warfare, we gained a great deal of tactical experience and technological accumulation. Researchers proposed developing a new generation of swarm unmanned fighter based on \"Yokai\". In addition to comprehensively strengthening mobility and protection, this strike craft carries a more advanced fire control system; the specially developed focused Arts laser can easily penetrate the enemy's shields and armor and damage the hull."
tech_ark_frighter_1_desc:0 "A heavy unmanned bomber developed with destruction as its primary objective. It sacrifices some protection and mobility, carrying a huge collapse-inducing bomb and striving to land a single hit and cause massive damage to enemy ships. Afterward, the strike craft will do its best to maneuver around the enemy ship to saturate its point-defense systems."


