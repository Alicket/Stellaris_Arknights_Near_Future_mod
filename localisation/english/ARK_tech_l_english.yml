l_english:

tech_galaxy_warship_army: "Landship Expedition Program"
tech_galaxy_warship_army_desc: "With the arrival of advanced boosters, the carrying capacity of transport units has risen sharply, and interstellar expeditions by land warships have become possible."

tech_originiums_biology_1: "Originium Biology: Basic Theory"
tech_originiums_biology_1_desc: "Exploring the fundamental mechanisms of interaction between Originium and living organisms, covering the distribution patterns of Originium within organisms, its metabolic pathways, and its effects on their physiological functions, laying the theoretical foundation for Originium biology."
tech_originiums_biology_2: "Originium Biology: Ecological Effects"
tech_originiums_biology_2_desc: "Analyzing the influence of Originium on different biological populations, revealing its complex role in the emergence and maintenance of biodiversity, and emphasizing the core position of Originium in maintaining the balance of ecosystems."
tech_originiums_biology_3: "Originium Biology: Adaptive Evolution"
tech_originiums_biology_3_desc: "Studying the adaptive evolution strategies of organisms in Originium environments, exploring the possibility of Originium as a driver of evolution, and how the properties of Originium can be used to promote the evolutionary process of organisms."
tech_originiums_mining:0 "Originium Mining"
tech_originiums_mining_desc:0 "Extracting these precious yet dangerous minerals requires careful discussion and long-term planning."
tech_yuanyan_rawmaterial:0 "Orirock"
tech_yuanyan_rawmaterial_desc:0 "Organic-rich rock mined from the surface, commonly found in areas where Originium has largely evaporated. Compared with Originium, it is a relatively easy material to gather, and is mainly used to improve Originium production efficiency."
tech_guyuanyan_rawmaterial:0 "Orirock Cube"
tech_guyuanyan_rawmaterial_desc:0 "Solid rock blocks mined from the surface, containing dense micropores; commonly used as an adsorbent for decomposed Originium gas. Mostly used in protective interlayers and the Originium production industry."
tech_guyuanyanzu_rawmaterial:0 "Orirock Cluster"
tech_guyuanyanzu_rawmaterial_desc:0 "Rock block clusters mined from the surface. They are the compressed and shaped product of Orirock Cubes, and are mainly used as raw material for Originium production projects."
tech_tichunyuanyan_rawmaterial:0 "Orirock Concentration"
tech_tichunyuanyan_rawmaterial_desc:0 "Orirock after a high degree of purification from rock block clusters mined on the surface. Nowadays it is mainly used for the industrial extraction and smelting of Originium."
tech_carbon_stick:0 "Carbon"
tech_carbon_stick_desc:0 "Carbon material used for the rapid development of infrastructure. It is one of the indispensable raw materials for building nomadic cities."
tech_carbon_brick:0 "Carbon Brick"
tech_carbon_brick_desc:0 "Lightweight, high-purity carbon bricks with excellent workability. The grand project of the nomadic city is built upon their backs."
tech_carbon_pack:0 "Carbon Pack"
tech_carbon_pack_desc:0 "A carbon pack containing a large amount of carbon resources. Every brick is filled with the burning soul of industry."
tech_light_building_material:0 "Light Building Material"
tech_light_building_material_desc:0 "Basic construction material for nomadic cities. It guarantees the integrity of infrastructure buildings and makes it possible to construct taller buildings."
tech_concrete_building_material:0 "Concrete Building Material"
tech_concrete_building_material_desc:0 "Reinforced construction material for nomadic cities. Maintenance with this material will greatly reduce the safety hazards of facilities, and allows more construction space to be taken up underground."
tech_reinforced_building_material:0 "Reinforced Building Material"
tech_reinforced_building_material_desc:0 "High-grade construction material for nomadic cities. Theory holds that currently known testing methods cannot compromise the structural integrity of buildings, which provides technical support for extending buildings upward and expanding underground."
tech_manufacturing_station:0 "Spaceport Factory"
tech_manufacturing_station_desc:0 "Following the same principle as the multi-purpose landship's resource production facilities, specially designed factory modules are launched to the spaceport and operate efficiently in zero gravity."
tech_machining_station:0 "Spaceport Workshop"
tech_machining_station_desc:0 "In the special environment of space, processing basic Orirock raw material into Originium far surpasses dangerous surface mining and complicated extraction, and this determines the new direction of Originium production."
tech_ark_laser_1:0 "Arts Laser"
tech_ark_laser_1_desc:0 "A high-energy laser generated by operating Originium energy Arts. Its wavelength is stable, and its energy does not decay over long ranges."
tech_ark_laser_2:0 "Focused Arts Laser"
tech_ark_laser_2_desc:0 "An enhanced model of the high-energy Arts laser. Transformation through the Originium energy gathering conduit array causes the laser's energy to surge."
tech_ark_polymer:0 "Arts Cohesion"
tech_ark_polymer_desc:0 "Using the plasticity of Originium Arts, we can confine destructive Arts energy within a medium vesicle that can be neutralized by shields."
tech_ark_disruptors:0 "Luminous-Umbral Disruptor"
tech_ark_disruptors_desc:0 "A disruptor weapon developed from the special abilities of legendary gods, capable of effectively destroying both shields and armor."
tech_ark_point_defence:0 "Arts Point-Defense System"
tech_ark_point_defence_desc:0 "A twin-barrel point-defense system fitted with hybrid Arts generators, used to counter the complex short-range threats of space combat."
