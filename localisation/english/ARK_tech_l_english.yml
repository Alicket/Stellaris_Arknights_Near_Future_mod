tech_ark_mass_accelerator_1:0 "Originium Heavy Cannon"
tech_ark_mass_accelerator_1_desc:0 "An Originium-powered mass accelerator cannon that can only be mounted on a spinal mount. It can target and engage targets at greater distances."
tech_ark_mass_accelerator_2:0 "Originium Macro Cannon"
tech_ark_mass_accelerator_2_desc:0 "An Originium-powered mass accelerator cannon that can only be mounted on a spinal mount. It has two acceleration rails and can target and engage targets at greater distances."
tech_ark_lovro_acc_1: "Lovro Kinetic-Thermal Transducer"
tech_ark_lovro_acc_1_desc: "[Work in Progress] A Lovro transducer that fires specially designed warheads, converting reactor heat directly into kinetic energy to give the warhead unimaginable speed. It can be loaded with a variety of warheads to produce different effects."
