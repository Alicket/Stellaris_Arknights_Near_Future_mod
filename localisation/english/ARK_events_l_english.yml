 ark_gateway_voyage_ship_accelerate_modifier:0 "ARK - Speed Modifier"
 ark_gateway.111.title:0 "The Roadnet Transport Ship Has Reached §l[ARK_TYRA_HOME_SYSTEM.GetName]§!"
 ark_gateway.111.desc:0 "After a long, slow but steady voyage, as the engine glow slowly fades, the Roadnet transport ship has finally reached its designated destination - the orbit of the primary star of the §l[ARK_TYRA_HOME_SYSTEM.GetName]§! system.\nUpon arrival, the mothership immediately released the several large automated vessels it carries, which look like both survey craft and construction scaffolding; these then flew toward the hyperlane jump points of the adjacent systems."
 ark_gateway.111.a:0 "Watch and see"
 ark_gateway.121.title:0 "Roadnet Survey Ships Have Reached Nearby Stars"
 ark_gateway.121.desc:0 "The hyperspace survey ships are much faster than their mothership; the one with the shortest route reached its destination in no time and appears to be preparing to return.\nAccording to the information recorded in the maintenance manual, these survey ships are in fact folded-form sublight tractor nodes and hyperspace accelerators. They will be placed near hyperlane jump points, and it seems they head to nearby systems to anchor coordinates."
 ark_gateway.121.a:0 "$CONFIRM$"
 ark_gateway.131.title:0 "Roadnet Survey Ships Have Returned"
 ark_gateway.131.desc:0 "The first hyperspace survey ship has returned to the system where the mothership is located. As it emerged from the hyperlane, it immediately anchored near the lane's jump point, then unfolded the various devices it carried one by one, finally deploying into an accelerator-like structure. The accompanying engineering team reports that its zero-point reactor is starting up, and a stable communication link with the mothership is being established."
 ark_gateway.132.title:0 "Roadnet Fully Deployed"
 ark_gateway.132.desc:0 "As the last survey ship returned to §l[ARK_TYRA_HOME_SYSTEM.GetName]§! and successfully unfolded near the jump point, the entire Roadnet system has been fully deployed within the system.\nNext, so long as all ships travelling within this system are connected to our specially designed Roadnet uplink, the main structure will bathe the fleet in a directed tractor beam and thereby push it to much higher sublight speed, while the subspace lane accelerators at the hyperlane jump points will assist the Roadnet proper in accelerating fleets leaving the system, significantly reducing hyperdrive charge time.\nThe blueprints for the Roadnet uplink have been submitted to the engineering bureau and can now be §Ybuilt at starbases§!."
 ark_gateway.132.a:0 "Excellent."


## Miscellaneous Events ##
 ark_arclight.3001.title:0 "Glow of the Star Garden"
 ark_arclight.3001.desc:0 "The engineering team in charge of salvaging Arc-I has completed its task. Battered by the passage of time, most of Arc-I's equipment has ceased to function. The salvage team brought back a decorative gyroscope recovered from Arc-I's cockpit; using it to commemorate the era-crossing significance of this project seems a very good choice."
 ark_arclight.3001.a:0 "Of course"

 ark_archive.2.title:0 "A Lost Treasure"
 ark_archive.2.desc:0 "Just after the battle ended, the fleet's salvage team went as usual to recover useful resources from the enemy's starship wreckage. While checking an undamaged container, a team member found an extremely exquisite crystal hidden inside.\nThis strange crystal is vivid red all over, and, amazingly, it seems to react to the team member's scanning seal Originium Arts; together with the ancient Leithanien script engraved on its base, we can conclude that this mysterious crystal originally belonged to us, and that its home is in Leithanien - yet for some unknown reason it fell into enemy hands. Smuggling, or enemy theft?\nBe that as it may, our dazzling collection now has a new member."
 ark_archive.2.a:0 "How strange - where is that violin sound coming from?"
