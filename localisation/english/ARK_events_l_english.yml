ark_game_start.100.title: "Talos-II Has Gone Dark!"
ark_game_start.100.desc: "I apologize for interrupting your start, but this popup appears because the Talos-II system may not have been generated correctly.\n§cIf there really is a planet called Talos-II on the right side of your interface and its system generated normally, please ignore this event and continue playing.§!\nChoosing the \"Cradle of Suffering\" origin will randomly select a system more than 10 jumps from Terra and more than 200 units away, and generate the system containing Talos-II around it; the generation guarantees that no owned system exists within three jumps of Talos-II's system. If it did not generate properly, it is probably because the galaxy is too crowded and the system could not find a suitable position - please consider starting a new game."
ark_game_start.100.a: "Oh no"


ark_originiums.1.name: "Originium Research Brief §G1§!"
ark_originiums.1.desc:0 "§LOriginium is an extremely excellent renewable clean energy source, and choosing it as the pillar of Terra's energy structure is reasonable and wise.§!\n\n£originiums£ $originiums$ as an energy source is excellent: easy to mine, convenient to store, simple to transport, safe and non-toxic, free of environmental pollution, high in energy density and extremely abundant in reserves. If we set aside the two hazards - that \"Originium may cause Catastrophes\" and that \"Originium may cause Oripathy\" - which are not part of the current criteria for judging energy superiority, Originium is an ideal renewable clean energy. Compared with the greenhouse effect worsened by fossil fuels, global warming, and the resulting rise in sea levels by several meters within a century that will submerge a fair number of coastal cities, the threat of Originium causing Catastrophes is almost negligible with the help of nomadic cities. And compared with the acute leukemia caused by radiation leaks from nuclear reactors, the threat that Originium may cause Oripathy is not that frightening either. In other words, as long as protective measures are in place, the dangers of Originium can be avoided. And the outstanding energy properties of Originium itself mean that no far-sighted ruler with insight would lightly give it up. That is to say, Terra's choice of Originium as the pillar of its energy structure is not only proper but highly wise."
ark_originiums.1.a:0 "File it away."
ark_originiums.2.name:0 "Originium Research Brief §G2§!"
ark_originiums.2.desc:0 "§LThe industrial system of Terra's world is an \"Originium industrial system\" with \"Originium Arts\" as its technical guide, whose technical pillar is \"Originium materials science\" rather than the \"materials science\" of natural science.§!\n\nTerra's industrial system is mainly an \"Originium industrial system\" centered on the industrial derivatives of \"Originium\" such as \"Orirock\" and \"Orirock Cube\", with other materials as auxiliaries. In this system, whether raw materials, processing, or finished products, \"Originium\" and the \"Originium Arts\" derived from it are always present. This reveals the essence of an industrial system centered on and based on Originium: it is not an industrial system guided by \"science\", but one guided by \"Originium Arts\". In such an industrial system, the technical pillar should be \"Originium materials science\", that is, using Originium Arts to directly drive chemical reactions, affecting matter at the molecular level, and with Originium itself as raw material, ultimately producing the materials required by \"Originium Arts\"."
ark_originiums.2.a:0 "File it away."
ark_originiums.3.name:0 "Originium Research Brief §G3§!"
ark_originiums.3.desc:0 "§LOriginium exhibits the properties of a pure substance, and may be a simple substance composed of a single element.§!\n\nBased on the purification of Orirock Concentration, it is initially inferred that \"Originium\" is not a mixture but a pure substance that can be purified.\nSo far, Originium does not show the characteristics of acid, base, salt or metal oxide among inorganic compounds. If Originium were a compound, the high temperatures a \"Catastrophe\" may produce would inevitably break its chemical bonds - yet in fact this does not happen; instead large amounts of Originium are produced and form ore veins. Unlike those chemical reactions that absorb heat at high temperatures, all current evidence indicates that Originium cannot be synthesized - otherwise one would only need to simulate Catastrophe conditions on a small, artificial scale to synthesize great amounts of Originium, yet no material proving that approach feasible has been found.\nTherefore, unless the chemical bonds of Originium can re-form while releasing heat after breaking endothermically, Originium can only be a simple substance. As a simple substance, Originium must be composed of a single element, which means it cannot form naturally through chemical reactions."
ark_originiums.3.a:0 "File it away."
ark_originiums.4.name:0 "Originium Research Brief §G4§!"
ark_originiums.4.desc:0 "§LOriginium does not obey the laws of natural science and is very likely a supernatural product.§!\n\nBy observing with electron microscopy the images of \"Originium proliferation within the bodies of Oripathy patients\", we have confirmed that the proliferation of Originium in the Infected resembles the medical process of \"fibrosis\". That means Originium can proliferate naturally within the human body - the appearance of a simple substance out of nothing. But to produce a simple substance, one element must be converted into another - that is a nuclear reaction, which means the generation of Originium must release energy comparable to a nuclear bomb of the same volume, and that is obviously impossible.\nIn summary, by reductio ad absurdum, we can preliminarily confirm that Originium does not obey scientific laws and is very likely a supernatural product."
ark_originiums.4.a:0 "File it away."
ark_originiums.uid_tooltip:0 "§BResearch Specialist Platenous Frost    UID 407843750§!"
ark_originiums_no_show:0 "Do not show this kind of report again"
ark_originiums_no_show_tooltip:0 "§YOriginium Research Briefs§! will stop appearing and be archived automatically."


#### Infected Event Chain ####
ark_originiums_sufferer.1.name:0 "Oripathy"
ark_originiums_sufferer.1.desc:0 "Oripathy is one link in the endless tragedies of the continent of Terra. To this day Oripathy still lacks any truly effective treatment; every medical approach can only slow the spread of the lesions to varying degrees. The Infected of today have become a serious problem second only to the Catastrophes, and their inevitable appearance and death significantly affect the social stability of Terra's civilizations. Every §R15 years§!, [Root.GetName] loses roughly §R1§! working population to Oripathy. To prevent such an outcome, a medical program built on existing research is imperative."
ark_originiums_sufferer.1.a:0 "Confirm"
ark_originiums_sufferer.1_tooltip:0 "Once the research program is established, you will periodically receive research briefs on §YOriginium§! and §YOripathy§!."
ORIPATHY_PROJECT:0 "Oripathy Eradication Program"
ORIPATHY_PROJECT_DESC:0 "Although the modern medical system keeps improving, treatment for Oripathy remains largely ineffective, and current drugs can only slow the spread of the lesions. Therefore, a drug that effectively suppresses the fusion of somatic cells and Originium has always been a key research subject for the major medical research institutions of [Root.Capital.GetName]. To prevent Oripathy from harming Terra's civilization and to safeguard social stability and the nation's long-term order, an effective \"Oripathy cure\" must be found. Fortunately, the rapid development of science and technology since Unification Day has provided new approaches and directions for the slow progress of Oripathy research, making it possible to overcome Oripathy."
ark_originiums_sufferer.11.name:0 "Oripathy Research Brief §G1§!"
ark_originiums_sufferer.11.desc:0 "Oripathy stems from Originium, the source of all suffering and prosperity. This thing, which possesses at least four properties - energy substance, industrial raw material, pathogen of an infectious disease, and medium of the occult - has cut off every possibility of easily analyzing its essence with its complexity and strangeness. But if we set aside Originium's properties in the fields of energy, materials and the supernatural, set aside all the imagery heaped upon it, and consider it merely as a pathogen, can we arrive at a satisfactory result?"
ark_originiums_sufferer.11.a:0 "File it away."
ark_originiums_sufferer.12.name:0 "Oripathy Research Brief §G2§!"
ark_originiums_sufferer.12.desc:0 "§GKnown findings of Oripathy research§!\n§Y1 Pathogen§!\nOriginium is a unique substance; it is not any kind of bacterium, fungus or virus, and appears fibrous under electron microscopy.\n§Y2 The Uninfected§!\nThe blood of uninfected, normal people contains trace amounts of Originium crystals.\n§Y3 Transmission, self-replication and pathology.§!\nAccording to Rhodes Island operator files and related records, most of the Infected contracted Oripathy through close contact with Originium; Originium replicates itself by fusing with somatic cells; tissues infected by Originium develop lesions (imaging monitoring of the Infected always shows blurred organ outlines and abnormal shadows) and functional abnormalities.\n§Y4 Immune system response§!\nIn the clinical diagnostic analysis of Oripathy, the diagnostic basis is not the presence or absence of an immune response, but imaging results, the somatic cell-Originium fusion rate and blood Originium crystal density. No record of inflammation caused by Oripathy has been found in any Infected's file."
ark_originiums_sufferer.12.a:0 "File it away."
ark_originiums_sufferer.13.name:0 "Oripathy Research Brief §G3§!"
ark_originiums_sufferer.13.desc:0 "Originium takes part extensively in the cellular composition of the vast majority of Terrans, save for the deep-sea race. On our cell membranes, Originium crystals form a substance known as Originium pseudoprotein. Specifically, Originium pseudoprotein not only shares important cellular life activities with membrane proteins, but also gives Terrans an ability the deep-sea race lacks: Originium Arts. Therefore, for the vast majority of Terrans, a suitable amount of Originium crystals in the blood is in fact a trace substance necessary for survival, and also the raw material for synthesizing Originium pseudoprotein."
ark_originiums_sufferer.13.a:0 "File it away."
ark_originiums_sufferer.14.name:0 "Oripathy Research Brief §G4§!"
ark_originiums_sufferer.14.desc:0 "High-purity Originium crystals are a kind of Originium polymer different from Originium pseudoprotein. Their relationship and difference are like those of a prion and cellular prion protein: the two are chemically identical, yet have completely different physical and chemical properties. When pathogenic Originium crystals come into direct contact with the body tissue of a healthy person, they induce the Originium pseudoprotein on the tissue cells to transform into pathogenic Originium crystals, just as a prion can convert the structure of cellular prion protein into its own structure. This process is called the fusion of Originium and somatic cells. Because of the structural change, most of the functions of the Originium pseudoprotein itself are either lost or weakened to varying degrees, and the only benefit such a change may bring is the improvement of Originium Arts adaptability caused by the appearance of pathogenic Originium crystals, or favorable mutations induced thereby."
ark_originiums_sufferer.14.a:0 "File it away."
ark_originiums_sufferer.15.name:0 "Oripathy Research Brief §G5§!"
ark_originiums_sufferer.15.desc:0 "The somatic cells first infected by pathogenic Originium crystals are the frontline base from which Oripathy expands its field of infection. On the one hand they assimilate the Originium pseudoprotein on normal cells around the infected somatic cells; on the other hand they spread through the body's circulatory system to other organs, causing multiple lesions in the Infected's body. Some pathogenic Originium crystals transformed from Originium pseudoprotein leave the cell they originally belonged to, gather together and deposit on the body surface, forming the typical characteristic of Oripathy patients: surface Originium crystals. The ultimate cause of death for the Infected may be organ failure caused by the proliferation of pathogenic Originium crystals, or complications contracted during the infection.\n\nFacing the vast world of Terra, still not fully revealed, we must keep our minds open."
ark_originiums_sufferer.15.a:0 "File it away."
ark_originiums_sufferer.uid_tooltip:0 "§BResearch Specialist Propranolol    UID 183955511§!"
ark_originiums_sufferer_no_show:0 "Do not show this kind of report again"
ark_originiums_sufferer_no_show_tooltip:0 "§YOripathy Research Briefs§! will stop appearing and be archived automatically."
ark_originiums_sufferer.2.name:0 "Rapid Progress on an Oripathy Cure"
ark_originiums_sufferer.2.desc:0 "Thanks to in-depth research into the pathology of Oripathy, the researchers and medical teams of [Root.Capital.GetName] have made rapid progress in developing a cure. The team leader states that the team has produced several practical and advanced medical approaches, recruitment of volunteers has begun, and Phase I clinical trials will start soon."
ark_originiums_sufferer.2.a:0 "May our efforts bear fruit at last."
ark_originiums_sufferer.3.name:0 "Oripathy Overcome!"
ark_originiums_sufferer.3.desc:0 "Through the efforts of countless researchers and medical workers, Oripathy - which shrouded every civilization and race of Terra for countless years - has finally been overcome! The all-new treatment and cure have been proven genuinely effective, and all of this is thanks to the new scientific ideas and great material discoveries of the interstellar age. New medical equipment and drug production lines have been dispatched across the globe at the fastest possible speed, and the Infected who have long suffered will soon be saved.\n\nAt the same time, overcoming \"Oripathy\" carries a deeper significance. It will build the great image of, and boundless trust in, the unified government in people's hearts, and it also means that the world war of years past truly ends only today, and Terra - long since set sail for the stars - truly enters the age of unification only today."
ark_originiums_sufferer.3.a:0 "The end of one link in the tragedy, the start of a new voyage."
ark_originiums_sufferer.3.a_tooltip:0 "§LIf Oripathy had never existed from the very beginning, would this land have turned out this way?§!"
ark_originiums_sufferer.4.name:0 "Infected Mortality Report"
ark_originiums_sufferer.4.desc:0 "Over the past 15 years, the number of working Infected who died across every sector of [Root.GetName] has exceeded expectations, causing social panic. Analysis holds that the large-scale spread of infection during the great turmoil before unification, together with the wide granting of citizenship to wilderness residents over those 15 years, gradually introduced errors caused by objective factors into the statistics. Government officials state that with the improvement of the citizen big-data system such errors will not happen again, but the actual loss of a large working population of skilled Infected has already left the level of development below expectations."
ark_originiums_sufferer.4.a:0 "This is heartbreaking"
ark_originiums_sufferer.4.b:0 "Such failures of work must never happen again."
ark_originiums_sufferer.4.c:0 "Do not show this kind of report again"
ark_originiums_sufferer.41.name:0 "Infected Mortality Report"
ark_originiums_sufferer.41.desc:0 "Over the past 15 years, the number of working Infected who died across every sector of [Root.GetName] totals §Y1§! Pop. The actual loss of a large working population of skilled Infected has left the level of development below expectations."
ark_originiums_sufferer.41.a:0 "This is heartbreaking"
ark_originiums_sufferer.41.b:0 "Do not show this kind of report again"

#### Deathline Event Chain ####
ark_deathline.1.name:0 "Deathline Notice"
ark_deathline.1.desc:0 "The Ministry of Health has submitted an early-warning report on Oripathy's \"deathline\". Because of the large-scale spread of infection caused by the former planetary war, there are huge numbers of Oripathy patients all over the world, and they are now nearing death; when that happens, our social order and production will suffer incalculable losses. To prevent such an outcome, a medical program built on existing research is imperative...\nIn addition, the Ministry of Health estimates that the deathline will arrive in §R15 years§!."
ark_deathline.1.a:0 "Confirm, and announce this to society."
ark_deathline.1.b:0 "Confirm, and keep this secret from society."
ark_deathline.2.name:0 "The Cover-Up"
ark_deathline.2.desc:0 "Word of the Oripathy deathline is spreading through the streets and alleys of [Root.Capital.GetName]! It seems the deathline report leaked, or perhaps the medical department accidentally published similar findings on its own. Either way, the public is talking, and leaders in some regions are asking the central government about it or requesting an investigation."
ark_deathline.2.a:0 "Announce that an investigative team has been formed, and confirm it later."
ark_deathline.2.b:0 "Vehemently deny that the \"deathline\" exists! Order the media to delete the reports."
ark_deathline.2.c:0 "Neither confirm nor deny; play it down."
ark_deathline.3.name:0 "Contingency Plan"
ark_deathline.3.desc:0 "The Oripathy deathline draws ever nearer, while the cure remains far off. To avoid being caught unprepared when the deathline arrives because the cure could not be finished on time, the research department has proposed a new plan: chemotherapy, dialysis, excision of lesions, artificial organ transplants and prosthetic limbs... This is by no means a long-term solution, but at least it can buy more time for the cure research."
ark_deathline.3.a:0 "Fund research into human implants"
ark_deathline.3.b:0 "We have no intention of supporting new projects now"
ark_deathline.31.name:0 "Prosthetic Bodies"
ark_deathline.31.desc:0 "Our human implant project is progressing well. With the funds redirected to it, large numbers of advanced medical machines have been designed and produced, clinical use has succeeded, and the condition of the Infected taking part in the trials is well under control. After the news broke, people argued about new treatments such as implants; some conservatives attacked them fiercely, while most patients asked about the cost of the new treatment. Our problem now is whether funding and research can be sustained."
ark_deathline.31.a:0 "Adopt the new treatment fully, with the government subsidizing patients."
ark_deathline.31.b:0 "Such ideas are too far ahead of their time; leave it to those who volunteer."
ark_deathline.4.name:0 "The Deathline Approaches!"
ark_deathline.4.desc:0 "Reports of Infected dying en masse have appeared in major hospitals and quarantine zones, and unregistered Infected have been found dead in several densely populated cities! The rapidly rising death reports and every sign have shattered people's last shred of illusion; everything shows that the \"Oripathy\" deathline is at hand!"
ark_deathline.4.a:0 "What more can we do?"
ark_deathline.5.name:0 "Oripathy Overcome!"
ark_deathline.5.desc:0 "Through the efforts of countless researchers and medical workers, the \"God's Lock\" that shrouded every race of Terra for countless years has finally been broken! The all-new cure has been proven genuinely effective, and all of this is thanks to the new scientific ideas and great material discoveries of the interstellar age. The new cure and its synthesis method have been dispatched across the globe at the fastest possible speed, and the Infected who have long suffered will soon be saved.\n\nAt the same time, overcoming \"Oripathy\" carries a deeper significance. It will build the great image of, and boundless trust in, the unified government in people's hearts, and it also means that the world war of years past truly ends only today, and Terra - long since set sail for the stars - truly enters the age of unification only today."
ark_deathline.5.a:0 "The disaster is over... and our voyage has only just begun..."
ark_deathline_5_tooltip:0 "§LA R K N I G H T S.§!"
ark_deathline.51.name:0 "Founding the Ministry of Health"
ark_deathline.51.desc:0 "On the long road to overcoming Oripathy, the researchers and medical teams of [Root.Capital.GetName] faced countless obstacles and hardships. Tested by crises and in ordinary work alike, our team accumulated rich experience. Now the blueprint of a new building plan - £building£ §Y$building_ark_hospital1$§! - has been drawn up, and it will become the ideal place for these outstanding teams to conduct life-science research and formulate health policy."
ark_deathline.51.a:0 "Good."
ark_deathline_51_tooltip:0 "£building£ §Y$building_ark_hospital$§! can now be upgraded to £building£ §Y$building_ark_hospital1$§!"
ark_deathline.6.name:0 "The Deathline Arrives."
ark_deathline.6.desc:0 "Despite the endless funds poured in and every effort made, regrettably we could not finish the \"Oripathy\" cure program or the contingency plan before the deathline arrived. Death reports keep pouring in from everywhere, many quarantine zones and cities have fallen into complete chaos, and some cities are nearly empty! The military is gradually sealing off the areas where infection is spreading, but cannot stop panicked citizens from fleeing to regions with few infections. On top of that, many Infected organizations have fallen apart with the arrival of the deathline, replaced by various illegal armed groups and terrorist bands that have risen in the chaos; utterly wiping them out will take endless time...\n\nOur medical team hopes to continue the cure research; without a cure, \"Oripathy\" remains the curse hanging over us."
ark_deathline.6.desc2:0 "Despite the endless funds poured in and every effort made, regrettably we could not finish the \"Oripathy\" cure program before the deathline arrived. Death reports keep pouring in, and some quarantine zones and cities have nearly fallen into chaos. Fortunately, our contingency plan was carried out, and more of the Infected survived. Though they are glad and grateful that the new treatment saved their lives, the terrifying sight of the deathline's arrival has frightened these people badly, and they yearn for a cure more urgently than before.\n\nThe military is gradually sealing off the areas where infection is spreading. On top of that, many Infected organizations have fallen apart with the arrival of the deathline, replaced by various illegal armed groups and terrorist bands that have risen in the chaos; utterly wiping them out will take a great deal of time...\n\nOur medical team hopes to continue the cure research; without a cure, \"Oripathy\" remains the curse hanging over us."
ark_deathline.6.desc3:0 "Despite the endless funds poured in and every effort made, regrettably we could not finish the \"Oripathy\" cure program before the deathline arrived. Death reports keep pouring in, and some quarantine zones and cities have nearly fallen into chaos. Although our contingency plan was carried out and some of the Infected survived, and though they are glad and grateful that the new treatment saved their lives, the terrifying sight of the deathline's arrival has frightened these people badly, and they yearn for a cure more urgently than before.\n\nThe military is gradually sealing off the areas where infection is spreading. On top of that, many Infected organizations have fallen apart with the arrival of the deathline, replaced by various illegal armed groups and terrorist bands that have risen in the chaos; utterly wiping them out will take a great deal of time...\n\nOur medical team hopes to continue the cure research; without a cure, \"Oripathy\" remains the curse hanging over us."
ark_deathline.6.a:0 "No... this is not the ideal world I expected!"
ark_deathline.6.b:0 "There is still hope, after all..."
DEATHCURE_PROJECT:0 "Death Cure"
DEATHCURE_PROJECT_DESC:0 "Improving the efficiency of \"Oripathy\" fusion suppression is a key research subject for the medical institutions of [Root.Capital.GetName], and because of its extreme difficulty it is nicknamed the \"God's Lock\". To avert the post-war \"Oripathy\" death wave and maintain social stability, an effective cure must be produced before the deathline arrives."


#### Riot Event Chain ####

## Infected Riots ##
ark_rebellion.1.name:0 "Riot Rumors"
ark_rebellion.1.desc:0 "Remnants of Reunion intend to incite the Infected into riots and to damage social order and the image of the unified government. Before we uncover more of their plans, it would be best to deploy troops to guard against the unexpected."
ark_rebellion.1.a:0 "Confirm."
ark_rebellion.11.name:0 "Infected Riot"
ark_rebellion.11.desc:0 "A group of Reunion remnants has launched premeditated riots in many parts of the world. They use the banner of a new Infected organization as cover and spread rumors that the government has done nothing about the deathline, deceiving and inciting many of the Infected to join."
ark_rebellion.11.a:0 "Crush them."
ark_rebellion.12.name:0 "The Riot Is Suppressed"
ark_rebellion.12.desc:0 "Under our fierce air strikes and assault the rioters have been successfully suppressed. Most of the participants were ordinary Infected who firmly believed the government had already developed a cure and had reserved it at an astronomical price for high officials and the rich."
ark_rebellion.12.a:0 "Confirm."
ark_rebellion.12_tooltip:0 "From now on, the Infected may attempt a riot at any time."
ark_rebellion.14.name:0 "Infected Riot: Pestilence"
ark_rebellion.14.desc:0 "Radical Infected organizations have launched another riot! Its scale is unprecedented, and many Sarkaz can be seen among the ranks of the rioters."
ark_rebellion.14.a:0 "Prepare for battle..."
ark_rebellion.15.name:0 "The Riot Is Suppressed"
ark_rebellion.15.desc:0 "Under our fierce air strikes and assault the rioters have been successfully suppressed. We made a special investigation of the Sarkaz among the rioters; most were mercenaries from before or during the war who intended to return to their old trade amid the growing chaos. Most belonged to one side of the Sarkaz civil war, and their main grievance against the unified government is the long-standing oppression by other Sarkaz factions. That faction now eagerly takes part in government and the military and has gained great influence, seeing itself as the sole representative body of the Sarkaz in the government. This is one of the bitter fruits of peaceful compromise."
ark_rebellion.15.a:0 "Nothing but a hypocritical excuse."
ark_rebellion.15.b:0 "Contact the leaders of the Kazdel region."

## Former Nations' Rebellion ##
ark_rebellion.2.name:0 "Remnants of the Old Era"
ark_rebellion.2.desc:0 "The remnants of the former national governments that oppose the joint government still exist. They still control some city-states and a considerable population, and try by various means to restore the motherland territories of the age of the split nations. Before we uncover more of their plans, it would be best to deploy troops to guard against the unexpected."
ark_rebellion.2.a:0 "Confirm."
ark_rebellion.21.name:0 "Restorationist Attack"
ark_rebellion.21.desc:0 "Restorationists drawn from the remnant forces of the former national governments have launched premeditated attacks in many places! They raise the flags of the nations of the split era and seek to overthrow by force the planetary government's rule over the region."
ark_rebellion.21.a:0 "Daydreaming"
ark_rebellion.22.name:0 "The Attackers Are Defeated"
ark_rebellion.22.desc:0 "Under our fierce blows the former national armies have been routed. However, the planners and leaders of the attack slipped out of our encirclement as soon as things turned bad, hiding in the controlled zones of the split nations that publicly disavow the attacks, and continue to play the patriot and the spiritual leader of the nation, spreading their narrow-minded ideas to bewitch the people."
ark_rebellion.22.a:0 "Confirm."
ark_rebellion.22_tooltip:0 "From now on, the split nations may attempt an attack at any time."
ark_rebellion.4.name:0 "The Age of Unification"
ark_rebellion.4.desc:0 "For a long time we have steadily reclaimed the split regions. Under our powerful economic and cultural offensive and the necessary use of force, the split regions have gradually returned and accepted the government's unified administration, and their political and military organizations have been dissolved or absorbed. As the last split city-state is taken over by government forces, [Root.GetName] has ended the division of the nation and entered a new era of prosperity and unity."
ark_rebellion.4.a:0 "Our voyage has only just begun."

## Crackdown Failure ##
ark_rebellion.5.name:0 "Crackdown Failed!"
ark_rebellion.5.desc:0 "Our forces collapsed under the rebels' attack! The rebels have taken most of the cities, and the still-intact administrative departments and forces at every level have gone underground or withdrawn to planetary orbit!"
ark_rebellion.5.a:0 "Order the space fleet to counterattack"

## Contacting Regional Leaders ##
ark_liasion.1.name:0 "Office of the Kazdel Regional Leader"
ark_liasion.1.desc:0 "§GShining§!\n\nHello, Doctor. I am the administrator of the Kazdel region. We know why you have contacted us, and I will truthfully tell you the real situation regarding the Sarkaz question."
ark_liasion.1.a:0 "Why did the Kazdel Peace Accord produce such bitter fruit?"
ark_liasion.11.desc:0 "§GShining§!\n\nAfter the world war, the followers of Theresa's faction helped Rhodes Island and its allies and advocated that their people accept her peaceful ideals, and so succeeded in signing a peace agreement with the new government as the representatives of Kazdel. By actively entering politics and the military, Theresa's followers gradually rose into the local administrative class of the new government. They style themselves the peacebringers of Kazdel, and while granting favors to their own people they make things difficult at every level for those of the formerly hostile Theresis faction, arousing widespread discontent among the former Theresis adherents.\n\nAfter this incident, some officials and officers demanded severe punishment for the rioters, while more remained silent."
ark_liasion.11.a:0 "Reshuffle the local government through investigation, detention and reassignment."
ark_liasion.11.a_tooltip:0 "Derelict officials cannot escape responsibility."
ark_liasion.11.b:0 "Severely punish the captured rioters and closely monitor their families and local suspects."
ark_liasion.11.b_tooltip:0 "The crime of rioting is unforgivable."
ark_liasion.11.c:0 "Also detain the derelict officials, and allow them to be released on bail."
ark_liasion.11.c_tooltip:0 "Take the chance to profit."
ark_liasion.11.response:0 "§GShining§!\n\nWhatever measures you decide on, we will carry out your orders strictly."
reunion_armies:0 "Rioting organizations are attacking the major cities of [Root.GetName]!"
racists_armies:0 "Rebel armies of the split nations are attacking the major cities of [Root.GetName]!"
build_armies_plan1:0 "Raise some defensive armies on [Root.GetName] to guard against the unexpected."
build_armies_plan2:0 "Raise more defensive armies on [Root.GetName] to guard against the unexpected."


#### Orbital Bombardment Event ####
ark_orbital_bombardment.4.name:0 "Originium Bombardment Contamination!"
ark_orbital_bombardment.4.desc:0 "We have confirmed that the enemy fleet is carrying out chemical bombardment of [Root.GetName] with Originium! Originium bombs will significantly contaminate [Root.GetName] and cause its inhabitants to contract acute Oripathy that is difficult to cure. We must take effective measures to stop the spread of Originium contamination as far as possible!"
ark_orbital_bombardment.4.a:0 "Confirm"
ark_orbital_bombardment.4_tooltip:0 "§HUnlocks Decision:§! Biochemical Protection"


#### Leader Events ####
ark_leader.1.name:0 "§REvil Spirit of Babel§!"
ark_leader.1.desc:0 "As the war between [Root.Owner.GetName] and its enemies drags on, the orders and deployments from the capital grow ever harsher and more ruthless. The Doctor's tactical thinking is being applied to every part of the imperial war machine, and what drives this machine is, of course, blood - whether one's own or the enemy's."
ark_leader.1.a:0 "An iron-blooded empire is awakening..."
ark_leader.11.name:0 "Evil Spirit of Babel"
ark_leader.11.desc:0 "A moment of peace, a starry sky without war, the embrace of peace... the empire's weapons are turning inward again, and the Doctor's attention returns to the empire's every limb. The endless expansion of the imperial consciousness seems to have paused for a while, but who knows whether he is utterly exhausted or still hungry for more?"
ark_leader.11.a:0 "Whose moment of respite is this?"


#### Catastrophe Events ####
ark_catastrophes.1.name:0 "Catastrophe"
ark_catastrophes.1.desc:0 "A sudden meteor shower on Terra obliterated every trace within nearly a hundred square kilometers! Several large cities and hundreds of settlements that received the Catastrophe warning have already relocated; no civilians died in the Catastrophe, but large numbers of modules and industries had to be abandoned in the impact zone. The Ministry of Health has announced a 50 percentage point increase in the regional infection risk and demands that the area be sealed off and declared an Infection Blockade Zone."
ark_catastrophes.1.a:0 "How unfortunate!"
ark_catastrophes.2.name:0 "Catastrophe"
ark_catastrophes.2.desc:0 "A powerful undersea earthquake triggered an enormous tsunami hundreds of kilometers wide with waves over a hundred meters high, which swept across a large stretch of coastline within just a few days. Although sirens filled every city the moment the quake struck, the major cities simply could not dismantle their modules in time. After the tsunami, large amounts of Originium minerals piled up on the shallow seabed, and the lower parts of the cities are in utter ruin, littered with collapsed buildings and the bodies of people and animals. The Ministry of Health demands that the area be sealed off and warns against contact with seawater."


#### Civic Events ####

## Commercial Union ##
ark_civic.1.name:0 "Commercial Union: 1st Civic"
ark_civic.11.name:0 "Commercial Union: 2nd Civic"
ark_civic.1.desc:0 "A commercial organization formed by the interstellar corporations that dominate society. These corporations take a broad part in governing the nation and profit from the process."
ark_civic.1.a:0 "Pharmaceutical Enterprise"
pharmaceutical_enterprises:0 "Relying on advanced technology and rapidly expanding other businesses, the pharmaceutical group headed by Rhodes Island Pharmaceuticals rose swiftly from the chaotic old world, and the government maintains comprehensive and deep cooperation with private medical groups.\n\nAllows construction of the special medical enterprise building £building£ §Y$building_ark_hospital$§!,\t\twhich can remove negative §Yleader§! disease traits,\t\tand better respond to epidemics and other emergencies.\t\t\nLeader lifespan: §G+10§! years"
ark_civic.1.b:0 "Warehousing and Logistics Group"
warehousing_logistics_groups:0 "This interstellar corporation was first founded as an independent private messenger company,\t\tdealing in selling information, armed escort and secret transport, and grew strong through such business.\t\t\n\nEmpire size from systems: §G-10%§!\nEmpire size from colonies: §G-10%§!"
ark_civic.1.c:0 "Investment Laboratories"
investment_laboratories:0 "This interstellar corporation is a prominent technology company,\t\tdedicated to expanding the practical application of all kinds of cutting-edge technology,\t\tand sparing no effort in promoting its new product concepts to raise research funding.\t\t\n\n£physics_research£ $physics_research$ from £job£ jobs: §G+10%§!\n£society_research£ $society_research$ from £job£ jobs: §G+10%§!\n£engineering_research£ $engineering_research$ from £job£ jobs: §G+10%§!"
ark_civic.1.d:0 "Security Contractors"
security_contractors:0 "This interstellar corporation began as a private security consultancy and is now one of the widely known security contractors. These mercenary contractors can rapidly provide the empire with fully organized combat units when necessary.\n\nArmy starting experience: §G+100§!\nArmy build speed: §G+20%§!\nArmy upkeep §G-20%§!"
ark_civic.1.e:0 "Industrial Manufacturers"
industry_manufacturers:0 "When the space age arrived, this interstellar corporation's rich manufacturing heritage established it as the leader of the military industry sector.\n\n£alloys£ $alloys$ from £job£ jobs: §G+10%§!"
ark_civic.1.f:0 "Circulation Business"
circulation_business:0 "Long before it grew big and strong, this interstellar corporation was already the largest private enterprise of a commercial city-state, focused on food, clothing and luxury goods - civilian commerce.\n\n£consumer_goods£ $consumer_goods$ from £job£ jobs: §G+10%§!"

## Union Summit ##
ark_civic.2.name:0 "Union Summit: 1st Civic"
ark_civic.21.name:0 "Union Summit: 2nd Civic"
ark_civic.2.a:0 "Messenger Network"
messenger_network:0 "The Messenger Network evolved from the volunteer organization of Catastrophe Messengers dedicated to disaster prevention and information exchange, and is now a public security force. To keep civilization safe from disaster, they do not hesitate to venture deep into treacherous mists and dangerous alien worlds.\n\nEmpire size from systems: §G-10%§!\nEmpire size from colonies: §G-10%§!"
ark_civic.2.b:0 "Security Services"
security_services:0 "A centralized, ruthless yet effective security apparatus protects the whole of society from threats internal and external.\n\nCodebreaking: §G+2§!\nEncryption: §G+2§!\nCrime: §G-5§!"
ark_civic.2.c:0 "Holy Notarial Hall"
holy_notarial_hall:0 "This society cannot function without the grassroots civil servants of the Notarial Hall. The Hall levies fees from citizens, urges them to fulfill all kinds of legal obligations, and provides various services to safeguard their rights and interests.\n\nEvery §Y20§! §YPops§! provide §G1§! §YExecutor job§!"
ark_civic.2.d:0 "Chivalry"
chivalry:0 "As the times have changed, knighthood has gradually turned from a title of status into a profession, but the spirit of chivalry has sunk deep into every corner of society.\n\nOur §YFleet Commanders§! and §YArmy Generals§! will receive the \"§GChivalry§!\" trait after recruitment."
ark_civic.2.e:0 "Heavy Taxation"
heavy_taxation:0 "Citizens must devote themselves wholeheartedly. Heavy taxes are the due return citizens make to society, and a powerful driving force for individual advancement.\n\nResources from jobs: §G+10%§!\nHappiness: §R-10%§!\nSlave resource output: §G+15%§! Slave happiness: §R-15%§!"

## Pharmaceutical Enterprise ##
ark_civic.30.name:0 "Medical Consultation"
ark_civic.30.desc:0 "Recently the health of [treatment_1.GetName] has drawn the attention of all society; people cannot accept that a leader who has contributed so much to the nation should live on tormented by illness. Our medical department held a consultation, and the medical experts taking part are confident about [treatment_1.GetName]'s recovery, as long as there is about §Y1 year§! of recuperation."
ark_civic.30.desc2:0 "Recently the mental state of [treatment_2.GetName] has drawn the attention of all society; people cannot accept that a leader who has contributed so much to the nation should live on tormented by psychological trauma. Our medical department held a consultation, and the medical experts taking part are confident about [treatment_2.GetName]'s psychological treatment, as long as there is about §Y1 year§! of recuperation."
ark_civic.30.desc3:0 "Recently the health of [treatment_3.GetName] has drawn the attention of all society; people cannot accept that a leader who has contributed so much to the nation should live on in agony. Our medical department held a consultation, and the medical experts taking part believe that [treatment_3.GetName] requires multiple operations and a long period of post-operative adjustment. Full recovery is expected to take §Y3 years§!."
ark_civic.30.desc4:0 "Recently the health of Doctor [treatment_1.GetName] has drawn the attention of all society; people cannot accept that the head of state who has contributed so much to the nation should live on tormented by illness. Our medical department held a consultation, and the medical experts taking part are confident about [treatment_1.GetName]'s recovery. However, since the position of Doctor is not one that can be left at will, the medical team suggests reducing the Doctor's workload and handing part of the work to a highly capable supporting team. This will cause some administrative inefficiency, but about §Y1 year§! of recuperation should restore full health."
ark_civic.30.desc5:0 "Recently the mental state of Doctor [treatment_2.GetName] has drawn the attention of all society; people cannot accept that the head of state who has contributed so much to the nation should live on tormented by psychological trauma. Our medical department held a consultation, and the medical experts taking part are confident about [treatment_2.GetName]'s psychological treatment. However, since the position of Doctor is not one that can be left at will, the medical team suggests reducing the Doctor's workload and handing part of the work to a highly capable supporting team. This will cause some administrative inefficiency, but about §Y1 year§! of recuperation should restore full health."
ark_civic.30.desc6:0 "Recently the health of Doctor [treatment_3.GetName] has drawn the attention of all society; people cannot accept that the head of state who has contributed so much to the nation should live on in agony. Our medical department held a consultation, and the medical experts taking part believe that [treatment_3.GetName] requires multiple operations and a long period of post-operative adjustment. However, since the position of Doctor is not one that can be left at will, the medical team suggests greatly reducing the Doctor's workload, handing most matters to a highly capable supporting team and leaving only important matters for the Doctor to decide. Full recovery is expected to take §Y3 years§!."
ark_civic.30.a:0 "Our leader will report to the hospital at once."
ark_civic.30.b:0 "Our leader first needs to finish the work at hand."
ark_civic.31.name:0 "Leader Recovered"
ark_civic.31.desc:0 "Thanks to the work and careful care of the medical team, [treatment_1.GetName]'s health has gradually improved, and at recent public appearances they have looked vigorous and radiant. More than once they have said in media interviews that they wish to return to work as soon as possible."
ark_civic.31.desc2:0 "Thanks to the work and careful care of the medical team, [treatment_2.GetName]'s mental state has gradually improved, and at recent public appearances they have looked vigorous and radiant. More than once they have said in media interviews that they wish to return to work as soon as possible."
ark_civic.31.desc3:0 "Thanks to the work and careful care of the medical team, [treatment_3.GetName]'s health has gradually improved, and at recent public appearances they have looked vigorous and radiant. More than once they have said in media interviews that they wish to return to work as soon as possible."
ark_civic.31.a:0 "Welcome back to work!"
ark_civic.9.name:0 "Analysis of the Incompatible Vaccine"
ark_civic.9.desc:0 "When the ancient guardians gave us the vaccine, a team of top medical experts secretly analyzed the mutated vaccine. They did not manage to finish before things went wrong, but they have now found several components in it that are theoretically highly beneficial to our physiology. Life scientists believe that with our advanced medical technology, recreating the correct vaccine is not impossible."
ark_civic.9.a:0 "Attempt to remake the vaccine."
MUTATIONS_PROJECT:0 "Remake the Ancient Guardians' Vaccine"
MUTATIONS_PROJECT_DESC:0 "The ancient guardians' mutated vaccine is not without merit; the various ancient yet beneficial contents found in it may help us restore the properties this vaccine once had."
ark_civic.91.name:0 "A Benign Vaccine"
ark_civic.91.desc:0 "Thanks to advanced medical knowledge our top medical team successfully remade the ancient guardians' vaccine. This vaccine reduces disease and increases population lifespan. The fear our people once had of the mutated vaccine has vanished, and everyone is enjoying a healthier and happier life."
ark_civic.91.a:0 "Excellent."


#### Crossover Events ####
ark_colab.1.name:0 "The Watcher on the Dark Side"
ark_colab.1.desc:0 "A report from the lunar development department: while carrying out expansion work on the dark side of the moon, engineers found a small alien ship of unknown origin. It appears to have been powered down for a long time, yet it remains completely invisible to engineering radar scans."
ark_colab.1.a:0 "Investigate where this ship came from."
ark_colab.1.b:0 "No - blow it up!"
ark_colab.1.b_tooltip:0 "It is too close to our homeworld! This is a trap!"
ark_colab.11.name:0 "The Abandoned Escort"
ark_colab.11.desc:0 "The research team boarded the alien ship smoothly, without any mishap. By analyzing the residual data we obtained a great deal of valuable alien material and technology.\nThe records show that the ship belonged to an unknown ancient precursor empire. About two hundred thousand years ago this escort suddenly jumped here, and then for unknown reasons was abandoned. However, the team has always had doubts about the ship's purpose, because the surviving onboard coordinates show that this place was a supply depot of one of that empire's observation stations, yet the whole team dug three thousand feet down and found no trace of a depot or any other facility.\n\nThere is also a self-criticism report here. We successfully obtained the data of a certain ancient weapon and that advanced ancient armor, but most of the ship's other weapon systems could no longer be repaired, and science specialist [Root.GetLeaderName] blames this on her own failed decryption attempts. She is deeply ashamed and has offered her resignation."
ark_colab.11.a:0 "It was only an ancient warship, after all"
ark_colab.11.a_tooltip:0 "Science specialist [Root.GetLeaderName] gained a great deal of materials science experience from this ship."
ark_colab.11.b:0 "[Root.GetLeaderName] must bear some responsibility for this."
ark_colab.11.b_tooltip:0 "Science specialist [Root.GetLeaderName] has become more careful in later work."
DARK_SIDE_SHIP:0 "Dark Side Ship"
DARK_SIDE_SHIP_DESC:0 "A small alien ship rests quietly on the dark side of the moon of [Root.Capital.GetName]. Its pitted hull shows that it has not moved for a very long time. Precisely because of that, the damaged hull now makes it visible to even our most advanced radar, proving that this is a real physical object and not some hologram or prank."


#### Other Events ####
ark_other.2.name:0 "A Strange Biosphere"
ark_other.2.desc:0 "Various enormous disasters occur frequently on [planet.GetName] - storms, earthquakes, meteor strikes and other incomprehensible natural calamities - and are great enemies of civilization. Nothing can withstand them. Yet while bringing destruction, Catastrophes also bring Originium - a mysterious mineral formed of crystallized natural energy. Our research team suggests an in-depth investigation of [planet.GetName]'s strange and unique biosphere."
ark_other.2.a:0 "How astonishing."



#### Kristen ####
ark_arclight.1.title:0 "External Fix"
ark_arclight.1.desc:0 "It has been some time since [root.GetSpeciesName] broke through the Skyveil and gained a foothold in space. Now there is finally time to attend to something long planned: recovering the Arc-I focusing generator and confirming the life status of Kristen, former Director of Rhine Lab.\nBecause of interference from the barrier layer, ground sensors cannot effectively locate Arc-I; the detectors in orbit must do the job."
ark_arclight.1.a:0 "Where is the proposal?"
SEARCHING_FOR_ARCLIGHT1_PROJECT:0 "$ark_arclight.1.title$"
SEARCHING_FOR_ARCLIGHT1_PROJECT_DESC:0 "§gThe proposal has not been written yet; everyone was too anxious and came to report the project first.§!\n\nThe research team will send several unmanned probe craft to search nearby orbital objects, but with the interference of the countless rock fragments of the planetary ring, finding the focusing generator will take some time."

ark_arclight.11.title:0 "Located"
ark_arclight.11.desc:0 "Not the picture from a textbook, nor a replica model in a museum. Arc-I now floats quietly before everyone's eyes. It was the first step of Terra's civilization into the stars, and in the hearts of countless scientists a symbol of pioneering and exploration. The aerospace pioneer Kristen chose to enter hibernation after stepping into the stars, and the debate over whether she still lives has never stopped since. Now that question will receive its final answer."
ark_arclight.11.a:0 "The moment of revelation has come"
OPENING_ARCLIGHT1_PROJECT:0 "Open the Module"
OPENING_ARCLIGHT1_PROJECT_DESC:0 "It is time to see her."

ark_arclight.12.title:0 "Docking Successful"
ark_arclight.12.desc:0 "The research ship docked with Arc-I quite smoothly, and the expedition quickly entered the outer modules. The space station before them is old and crude, yet every scientist feels genuine reverence. As the exploration goes deeper, they see an ecological garden whose plants have all withered, instruments that give no proper readings, and malfunctioning equipment. In such a discouraging atmosphere they have reached the final core section, and under the light of the starry sky there is a rectangular container, in which a golden-haired Perro lies quietly.\nThe button to open the hibernation device is clearly marked, and whether out of optimism or pessimism, it is time to press it."
ark_arclight.12.a:0 "It is only a bed that is not very comfortable to lie on"
ark_arclight.12.b:0 "rather than a coffin not quite suitable for burial"

ark_arclight.121.title:0 "Kristen Wright"
ark_arclight.121.desc:0 "Clearly, this pioneer has not become one with the boundless stars she pursued all her life. However, because that life-support equipment is, after all, a very old model, and the launch procedure apparently did not strictly follow sterile protocol, the medical team refuses to let anyone see Kristen."
ark_arclight.121.a:0 "Rest well."

ark_arclight.122.title:0 "The Starry Sky"
ark_arclight.122.desc:0 "It has been four months since we welcomed back the former Rhine Lab Director. Every time the medical staff enter her recovery room, Kristen's blazing gaze is fixed on the lonely sky outside the window. It is not hard to see from her eyes her longing for the vast universe - in fact, her love of the starry sky is known to all - and Kristen, whose bodily functions have recovered to some degree, has applied for the raw data of several unexplored planets to be routed to her, along with some essential data analysis instruments.\nKristen wishes to complete a rehabilitation that belongs to science alone, in the bearing of a pioneer.\n\n----------\nDenied.\nSigned: Kal'tsit"
ark_arclight.122.a:0 "Ha"
ark_arclight.122.a.tooltip:0 "By Kal'tsit's order, Kristen must rest for a full year before she may engage in activity."

ark_arclight.123.title:0 "An Endless Road Ahead"
ark_arclight.123.desc:0 "With Kristen signing her name on the discharge notice, it seems there is no need to say more about what she will do next."
ark_arclight.123.a:0 "Better prepare a new research ship."

ark_arclight.13.name:0 "$ark_arclight.121.title$"
ark_arclight.13.desc:0 "The still spotless button was pressed, and with the sound of depressurization the hibernation pod's door slowly opened, and the accompanying doctor rushed forward at once.\nThanks to Rhine Lab's very advanced and powerful life-support equipment for that era, the former Director's vital signs are stable, though she remains unconscious as in cryosleep.\nAfter a while, with a single cough, she slowly opened her eyes."
kristen_catch_phrase:0 "When shall we break through the next \"Skyveil\" that binds us?"
kristen_description:0 "Kristen Wright was once the Director of Rhine Lab, the most advanced technology enterprise on Terra, and the first person to break through the barrier layer and enter space."
kristen_hire_tooltip:0 "§BLegendary Leader§! §YKristen Wright§! will join our empire as a §YScientist§!!"
ark_arclight.13.a:0 "How does \"time travel\" feel?"
ark_arclight.13.b:0 "Trevor Friston reset his memories."
ark_arclight.13.c:0 "What do you want to do in the future?"
ark_arclight.13.d:0 "Would you like to see your old friends? Some of them are still alive."
ark_arclight.13.a.response:0 "\"Even for me, this feeling of a world apart is so unfamiliar. A moment ago I was bidding the universe farewell, thinking my life was about to end. But the next moment, the descendants of Terra could already break through the Skyveil and come before me.\""
ark_arclight.13.b.response:0 "\"Friston... he calls himself the guardian and preserver of civilization, a dutiful and honorable man. To him those long memories were only a heavy burden, and casting them away was perhaps the best choice. Compared with that, my hibernation looks far easier.\""
ark_arclight.13.c.response:0 "\"5 days, 8 hours and 43 minutes. If we take breaking through the barrier layer as the boundary, that is all the time I have spent in the universe, and I am not satisfied with it. Being a selfish and greedy person, I long to stretch that time indefinitely - until it reaches the limit of my life.\""
ark_arclight.13.d.response:0 "Kristen did not answer; she seemed to be talking to herself: \"Saria, Ferdinand, Nasti, Yara, little Justin, Dorothy, Muelsyse, and Parvis...\"\nThen came a long silence. Perhaps this conversation should end here."
kristen_finish_talk:0 "Conversation End"

ark_arclight.141.title:0 "Become a Pioneer Again?"
ark_arclight.141.desc:0 "After long study, together with the rich experience of exploring alien worlds, the mind of [ark_leader_kristen.GetName] has fully caught up with - or even once again surpassed - the present age, and now her head is full of countless avant-garde and novel ideas."
ark_arclight.141.a:0 "The sea of learning has no bounds"
ark_arclight.141.a.tooltip:0 "§Y[ark_leader_kristen.GetName]§! gains the §BFearless Pioneer§! trait"



#### Project Horizon Arc Events ####
ark_arclight.211.title:0 "S.H.A.F.T. XII Technical Breakthrough"
ark_arclight.211.desc:0 "The scientists and engineers on [ark_planet_terra.GetName] have submitted a report: they have overcome the technical difficulties of upgrading S.H.A.F.T. XI, and now, given enough resources, the energy wells can be upgraded with greatly improved performance."
ark_arclight.211.a:0 "$CONFIRM$"

ark_arclight.2211.title:0 "S.H.A.F.T. XIII Technical Breakthrough"
ark_arclight.2211.desc:0 "The scientists and engineers on [ark_planet_terra.GetName] have submitted a report: they have largely overcome the technical difficulties of upgrading S.H.A.F.T. XII and now request an additional batch of research resources for the next round of experiments."
ark_arclight.2211.a:0 "$ark_arclight.211.a$"
ark_arclight.2211.a.tooltip:0 "See the special project for the required research resources."
ARCLIGHT_WELL12_UPGRADE_PROJECT:0 "Arc S.H.A.F.T. XII Upgrade Plan"
ARCLIGHT_WELL12_UPGRADE_PROJECT_DESC:0 "$ark_arclight.2211.desc$"

ark_arclight.222.title:0 "Experiment Accident"
ark_arclight.222.desc:0 "The scientists and engineers on [ark_planet_terra.GetName] were conducting the final test of the core equipment for the S.H.A.F.T. XII upgrade when the entire upgrade assembly exploded violently, instantly claiming the lives of dozens of workers.\nThe engineers are urgently investigating the accident, but the whole project has to be suspended for the time being."
ark_arclight.222.a:0 "Find out the cause as soon as possible."

ark_arclight.223.title:0 "Reset Complete"
ark_arclight.223.desc:0 "The scientists and engineers on [ark_planet_terra.GetName] reproduced the accident: a poorly designed cooling line had been baked at high temperature for a long time, weakening its structural strength until it ruptured under the extreme internal pressure; the leaking coolant vaporized rapidly and shattered a very fragile composite refractive crystal, and the running equipment was burned through from the inside by the high temperature, finally exploding.\nHaving learned the lesson, the engineers redesigned the relevant structures and produced the blueprints for S.H.A.F.T. XIV, and the upgrade of S.H.A.F.T. XII is ready."
ark_arclight.223.a:0 "$ark_arclight.211.a$"

ark_arclight.231.title:0 "Tear the Sky?"
ark_arclight.231.desc:0 "For a long time our idea has been to open a hole in the barrier layer, so that this planet has an entrance to the stars. But this situation must be escaped sooner or later, and the scientists have offered two options: the first is to tear this false curtain apart completely; the second is to use the barrier layer as an indestructible planetary shield to protect our planet, though three more energy wells would have to be built to meet the needs of communication with the outside world.\nThe craziest is the first: someone proposed building a huge planet-killer weapon and shattering the barrier layer by bombarding it from outside, but a single misstep would destroy us. Therefore another approach, which fits well with the second option, is to build three more energy wells and, by repeatedly overloading and bombarding the barrier layer, make it collapse from the inside out.\n\nEither way, building three more wells is absolutely necessary."
ark_arclight.231.a:0 "Then tear it apart."
ark_arclight.231.b:0 "If it can serve us, why not use it?"

ark_arclight.2311.title:0 "Tear the Sky!"
ark_arclight.2311.desc:0 "Now that tearing it apart has been chosen, the engineering department has submitted the feasibility study and budget; only construction remains.\n§v$ark_arclight.2311.a.tooltip$§!"
ark_arclight.2311.a:0 "$ark_arclight.211.a$"
ark_arclight.2311.a.tooltip:0 "Carried out through a planetary decision"

ark_arclight.2312.title:0 "Make It Our Own"
ark_arclight.2312.desc:0 "To avoid breaking the customs of some regions and to avert possible risks, let us act on the premise of meeting our own needs. The engineering department has submitted the feasibility study and budget; only construction remains.\n§v$ark_arclight.2311.a.tooltip$§!"
ark_arclight.2312.a:0 "$ark_arclight.211.a$"
ark_arclight.2312.a.tooltip:0 "$ark_arclight.2311.a.tooltip$"

ark_arclight.241.title:0 "$ark_arclight.2311.title$"
ark_arclight.241.desc:0 "The four energy wells have been built and are running. They strike the sky at maximum power in pulses; crest meets crest, and ripples spread endlessly across the barrier layer.\nScientists estimate that the whole barrier layer will be perfectly dismantled in just one year."
ark_arclight.241.a:0 "$GOOD$"
ark_arclight.242.title:0 "All Directions"
ark_arclight.242.desc:0 "After long construction, the last facility of Project Horizon Arc - S.H.A.F.T. XVII - has been calibrated and put into service. Four magnificent structures now stand on the planet's equator, and four pillars of light open four doors to space for [ark_planet_terra.GetName]. Though this false sky still hangs overhead, everyone has long grown used to it over the millennia, and the interstellar tourism business - now widespread - keeps the horizons of [root.GetSpeciesName] from being confined to the ground. In short, we no longer need to worry about anyone harming this planet in the slightest - unless they are capable of §Rinstantly shattering§! the entire planet"
ark_arclight.242.a:0 "I suppose this counts as a good ending too?"

ark_arclight.25.title:0 "Clear Skies"
ark_arclight.25.desc:0 "After about a year of relentless bombardment, the detectors can no longer pick up any energy signature of the barrier layer, and after confirming the results the science team published its conclusion: the barrier layer has been completely dismantled and Project Horizon Arc is officially over.\n\nThe thick curtain that shrouded [root.GetSpeciesName] has become a thing of the past, and the real starry sky is laid out before everyone's eyes.\n\nAs S.H.A.F.T. XVII gradually falls silent, Project Horizon Arc - spanning several generations - comes to a complete end, and these four S.H.A.F.T.s will be open to all citizens as permanent research and art facilities."
ark_arclight.25.a:0 "This is one giant leap for [root.GetSpeciesName]."

 ## Roadnet ##
 ark_gateway.20.title:0 "Mysterious Starship"
 ark_gateway.20.desc:0 "When [this.GetName] entered the [from.GetName] system, long-range sensors immediately caught a colossal object in a planet's orbit. Analysis shows it is not a natural formation; we recommend going to those coordinates at once for a detailed scan."
 ark_gateway.20.a:0 "$CONFIRM$"
 ARK_GATEWAY_ARCHAEOLOGY_PROJECT:0 "Investigate the Mysterious Starship"
 ARK_GATEWAY_ARCHAEOLOGY_PROJECT_DESC:0 "$ark_gateway.20.desc$"
 ark_gateway.21.title:0 "A Corner of the Precursor Civilization"
 ark_gateway.21.desc:0 "After a detailed investigation we still do not understand what this starship is for, and we cannot even open the airlock to get inside; even a high-energy laser cannot scratch the hull.\nBut from the ship's shape and residual particle scans we can confirm that it comes from the precursor civilization, is fully intact, shows no obvious signs of damage, and seems as though some procedure could restart it.\nIn short, there is nothing to do now but stare at it; perhaps one day, as technology advances, we will discover the true purpose of this colossal object."
 ark_gateway.21.a:0 "A pity."
 #After gaining Zero Point Power and Hyper Relay technology
 ark_gateway.3.title:0 "Investigate the Mysterious Starship Again"
 ark_gateway.3.desc:0 "Word comes from the scientists stationed at the starbase in [ark_gateway_archaeology_system.GetName]: while fitting the ship with the newest model of zero-point power engine, the science team happened to notice that some structures at the engine nozzle closely resemble those at the mysterious starship's exhaust, and even more coincidentally, some of the starship's field-maintenance devices are exactly like our known hyper relays! The research team recommends a second full investigation of the mysterious starship, to see whether advancing technology can offer new means to uncover its secrets."
 ark_gateway.3.a:0 "$CONFIRM$"
 ARK_GATEWAY_ARCHAEOLOGY_PROJECT_2:0 "Investigate the Mysterious Starship Again"
 ARK_GATEWAY_ARCHAEOLOGY_PROJECT_2_DESC:0 "$ark_gateway.3.desc$"
 ark_gateway.31.title:0 "Investigate the Mysterious Starship Again"
 ark_gateway.31.desc:0 "All went smoothly: after a full inspection of the starship we found that part of its technology is already known to us. We still cannot enter by normal means, but the engineering team cut open the airlock door with hand-held cutters as easily as slicing tofu. Recalling that long ago even beam weapons of naval-gun grade could do nothing to it, every member of the investigation team marvels at the advance of technology.\nBefore us lies the completely unknown interior of the starship, and the scientists, raring to go, are ready to fly in and find out.\n§YThis archaeological site may not appear on the system view; please assign a science officer from the situation log to excavate it.§!"
 ark_gateway.31.a:0 "$CONFIRM$"
 ark_gateway.31.tooltip:0 "§YThis archaeological site may not appear on the system view; please assign a science officer from the situation log to excavate it.§!"
 ark_gateway_archae:0 "Mysterious Starship"
 ark_gateway_archae_desc:0 "The colossal object in [ark_gateway_archaeology_system.GetName], an engineering marvel of the precursor civilization, awaits our exploration."
 ark_gateway.311.title:0 "Not a Soul Aboard"
 ark_gateway.311.desc:0 "After the research team entered the ship and comprehensively scanned the corridor structures, one problem immediately became clear: the starship's interior is extraordinarily cramped. Though the corridors run in all directions and reach every part of the ship quickly, there is no spare space at all for activity.\nMeanwhile, no signs of life or organic residue can be detected aboard, nor are there any structures resembling cryosleep pods. The scientists conclude that this must be an unmanned automated vessel, and that the corridors are merely maintenance passages.\nThe team split into several groups, each heading to an important compartment to check for noteworthy clues."
 ark_gateway.311.a:0 "$CONFIRM$"
 ark_gateway.312.title:0 "The Bridge"
 ark_gateway.312.desc:0 "The area the team's main force took charge of was naturally the passage leading to the starship's bridge.\nAfter the hatch opened, the equally cramped bridge turned out to be crammed with screens and buttons, and since it is in space and well sealed, everything is spotless.\nSeveral Originium data-storage crystals lie scattered in front of the console, of the same style as the precursor Originium storage crystals we have seen before.\nDecryption of these crystals is already in full swing."
 ark_gateway.312.a:0 "$GOOD$"
 ark_gateway.313.title:0 "Setting Out"
 ark_gateway.313.desc:0 "The first crystal has been fully decrypted.\n\n§c- Tell me, why do we of all people have to go along with this thing? It is precious as can be - one jump only takes us a few light-years, and after every jump it needs a full overhaul; getting it from the port to the laboratory takes years. Are we doing prison time here?\n- Probably, yes.\n\n- Every day it is wait on the young miss, wait on the young miss. The engineering department has already made this thing's self-check system practically perfect, and two inspections a day turn up nothing at all...\n- What can you do about it? This thing is a project on the same level as the ◼◼ network; not a single mistake is allowed. All right, connect my oxygen line, it is time to go.§!"
 ark_gateway.313.a:0 "A convoy engineer, it seems?"
 ark_gateway.314.title:0 "^&*(Trace Lost"
 ark_gateway.314.desc:0 "The second crystal has been fully decrypted.\n\n§c- Orbit stable, cargo intact, the transport fleet has reached waypoint sixteen and begun a thirty-day overhaul of the long-range cruise engine.\n\n- On the second day of the overhaul, the scanner found a nice flat plain on the surface of [ark_gateway_archaeology_planet.GetName]. Nobody has set foot on ground for a long time, so fleet command approved sending drones down to build a temporary camp.\n\n- On day 22 of the overhaul, the convoy urgently ordered the surface crew to return to the ships at once; the fleet was about to make an emergency return. No one knew what had happened, and everyone was anxious.§!"
 ark_gateway.314.a:0 "Unsettling."
 ark_gateway.315.title:0 "No Word At All"
 ark_gateway.315.desc:0 "The third crystal has been fully decrypted.\n\n§c- It seems something very troublesome has come at us from the rear, and most of the fleet has been pulled back to the defense line. - Mm, it must be them.\n- All that is left here is our one engineering ship, a sufficient stock of supplies, and... this \"Roadnet\" prototype.\n- ......\n- It has been several months. We have done nothing but maintain and survey, the port does not answer, supplies are running low, and if we do not leave soon we will starve here...\n- Supplies are nearly gone and the port still does not answer; there is no word from §gthe Doctor§! either. It seems we are on our own.§!"
 ark_gateway.315.a:0 "$CONFIRM$"
 ark_gateway.316.title:0 "\"Roadnet\""
 ark_gateway.316.desc:0 "The fourth crystal has been fully decrypted.\n\n§c- The long-silent comms channel finally stirred: the port has fallen, enemy unknown, stop the Roadnet project immediately and take shelter at the nearest friendly facility. The port? Fallen? They could take that fully armed naval fortress?\n- Time to go. Judging by our supplies, we should have enough to reach §gthe Doctor§! at maximum speed. Oh - yesterday several stars in the background over the port disappeared. I hope that was my imagination.\n- Now that the port is gone, we are not far from death ourselves. One small engineering ship can never take proper care of this Roadnet. I will store all of this ship's maintenance logs and operating manuals in the crystal on the right; if anyone finds them in the future, try restarting it. Also, I will take the complete design schematics of the Roadnet system with me; if you want to know about them, go ask old Friston over at §gthe Doctor§!'s side. I expect I will be lying in one of those coffins soon enough.\n- Decrypted by the enemy? Ha, no. Only we understand this technology, and those alien folks could never grasp what Originium is. Whoever reads this can only be our descendants.\n\n-- Chief Designer of the Roadnet Project\tEvi Nelsius§!"
 ark_gateway.316.a:0 "Friston-3, do you have any idea?"
 ark_gateway.316.a.tooltip:0 "§gNone.§!"
 ark_gateway.317.title:0 "\"Roadnet\""
 ark_gateway.317.desc:0 "The last crystal has finally been decrypted. As the previous crystal said, this one contains the maintenance logs and operating manuals of \"Roadnet\", and this enormous starship exists solely to carry the Roadnet prototype device to a target system and deploy it.\nBecause the manuals are so detailed, our engineers have not yet fully parsed every detail, but one thing is certain: with enough resources this starship can be restarted, and it will then automatically travel to the target system under the system's navigation and deploy the whole system. We may as well give it a try."
 ark_gateway.317.a:0 "$CONFIRM$"
 ARK_GATEWAY_ARCHAEOLOGY_PROJECT_3:0 "Restart \"Roadnet\""
 ARK_GATEWAY_ARCHAEOLOGY_PROJECT_3_DESC:0 "A mysterious device from the precursor civilization. According to the manual, with enough resources and proper maintenance this transport ship will automatically travel to its destination and complete its mission."
 ARK_GATEWAY_ARCHAEOLOGY_PROJECT_321:0 "Old Matters, New Life"
 ARK_GATEWAY_ARCHAEOLOGY_PROJECT_321_DESC:0 "Fit the ancient Roadnet transport ship with our newest hyperdrive so that it can reach its destination sooner.\nBecause this project requires reworking the ship's navigation system and specially designing an enormous hyperdrive, it will take a considerable amount of time."
 #After completing the restart Roadnet special project
 ark_gateway.32.title:0 "A Long Road"
 ark_gateway.32.desc:0 "The engineers have repaired this delicate iron hulk according to the maintenance logs and operating manuals. After nervously starting the system, at the very bottom of the console's endless log they see one line:\n§RError - Waypoint jump beacon offline!§!\nIt is understandable that the jump beacon is gone, but what about the conventional route? This ship has no hyperdrive!\nHundreds of years ago we already knew the precursor civilization had jump technology, but the equipment carried aboard this ship exists to serve hyperspace lanes - so why does it not have a hyperdrive of its own?\nAfter heated discussion and verification, and after comparing the existing records on the precursor civilization, the baffled scientists reached a conclusion: until the eve of the precursor civilization's destruction, hyperspace lanes and their technology had only just appeared; before that, precursor ships moved using jump technology, and because this ship was of great importance and its technology unproven, the precursor civilization chose the safer beacon-style jump navigation to prevent errors in direct coordinate jumps.\nTwo paths now lie before us. The first: fit the ship with a hyperdrive and re-plot the route, but this will take a great deal of time and resources to rework the system to suit our technology. The second: directly activate the ship's emergency conventional navigation and let it slowly fly to its destination through normal space - by the estimate Chief Designer Nelsius left in the crystal, this will take at least ten years."
 ark_gateway.32.a:0 "Time is money; let us see what this thing is."
 ark_gateway.32.a.tooltip:0 "Fitting the transport ship with a hyperdrive requires a scientist to research it, taking 1800 days."
 ark_gateway.32.b:0 "Our scientists have more important things to do."
 ark_gateway.32.b.tooltip:0 "§gWait for Roadnet to arrive through conventional space§!§l[ARK_TYRA_HOME_SYSTEM.GetName]§!"
 #Hyperdrive fitted
 ark_gateway.321.title:0 "Roadnet Has Set Off"
 ark_gateway.321.desc:0 "With the brand-new hyperdrive installed and the route set, and just as the decrypted data in the crystal said, Roadnet is heading straight for §Y[ARK_TYRA_HOME_SYSTEM.GetName]§!. Seemingly to ensure the stability of the equipment, compared with the transport ship's enormous volume and mass the six relatively small engines look very feeble; even at full power they cannot accelerate the transport ship to the average starting level of our civilian ships.\nThe engineers in charge of this project are closely monitoring every movement of the transport ship; perhaps there will be new findings once it reaches its destination."
 ark_gateway.321.a:0 "$CONTINUE$"
 ark_gateway.321.tooltip:0 "§gWait for Roadnet to arrive§!§l[ARK_TYRA_HOME_SYSTEM.GetName]§!"
 ark_gateway.322.title:0 "Roadnet Has Set Off"
 ark_gateway.322.desc:0 "We activated the transport ship's emergency conventional navigation system. Soon the onboard computer calculated a suitable route. As the engine nozzles gradually lit up, this giant steel beast slowly shifted its heavy body. Seemingly to ensure the stability of the equipment, compared with the transport ship's enormous volume and mass the several relatively small engines look very feeble; even at full power they cannot accelerate the transport ship to the average starting level of our civilian ships.\nWith thrust like that, can it really reach its destination within ten years?"
 ark_gateway.322.a:0 "We shall see."
 ark_gateway.322.a.tooltip:0 "§gWait for Roadnet to arrive§!§l[ARK_TYRA_HOME_SYSTEM.GetName]§!"
 ark_gateway.3232.title:0 "Acceleration"
 ark_gateway.3232.desc:0 "As it turns out, our worries were completely unfounded. The Roadnet transport ship is flying steadily toward the dark depths of space at an unbelievable constant acceleration; relativity seems to lose its effect before this creation of the precursor civilization, and even our fastest racing ships could never catch up with it.\nWe had thought that with hyperdrives our deep-space travel technology had surpassed the precursor civilization, yet before this ship ours looks so feeble once again."
 ark_gateway.3232.a:0 "Then we wait patiently."
 ark_gateway.3232.a.tooltip:0 "§gWait for Roadnet to arrive§!§l[ARK_TYRA_HOME_SYSTEM.GetName]§!"

