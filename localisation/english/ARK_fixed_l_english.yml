ark_ascension_perks.13.desc:0 "Through careful planning and the necessary investment in research, the hull points, shield points and armor of all our starbases, defense platforms and ships have all been improved to varying degrees, and the orbital bombardment damage taken by planets is reduced."
ark_ascension_perks.13.a:0 "Excellent"
