FLAG_CATEGORY_hypergryph:0 "Hypergryph"

## Species Traits ##
trait_latent_oripathy:0 "Latent Oripathy"
trait_latent_oripathy_desc:0 "§LLiving for a long time in an environment affected by Originium and its industrial by-products makes people more susceptible to an incurable disease known as \"Oripathy\"."
trait_Originium_Arts:0 "Originium Arts"
trait_Originium_Arts_desc:0 "§LAs the \"God's Lock\" was broken and a cure for Oripathy appeared, \"Oripathy\" is no longer a despairing incurable disease, it will instead become an advantage.§!"
trait_acute_oripathy:0 "Acute Oripathy"
trait_acute_oripathy_desc:0 "Acute Oripathy caused by exposure to a massive amount of Originium contamination in a short time. Infected individuals who lack effective treatment will die within two months at the latest."

## Leader Traits ##
# Generic #
leader_trait_oripathy:0 "Oripathy"
leader_trait_oripathy_desc:0 "This leader is an Infected."
leader_trait_vampire:0 "Vampire"
leader_trait_vampire_desc:0 "This leader belongs to the Vampires, the most notorious branch of the often-demonized Sarkaz race.\n§LThey walk through the night, feeding on the blood of others, killing without mercy and stopping at nothing... I can't keep making this up.§!"
leader_trait_tiandaochouqin:0 "Heaven Rewards the Diligent"
leader_trait_tiandaochouqin_desc:0 "This leader is extremely diligent in work and study, believing that as long as enough effort is put in, the corresponding reward will surely come in the future."
# Ruler #
trait_ruler_walk_in_dust_r:0 "Walk in the Dust"
trait_ruler_walk_in_dust_r_desc:0 "In her eyes rest the land and the era. Civilizations have changed in countless ways, and she has wandered for a long time. Just like all living beings."
trait_ruler_kaltsit_knowledgeable:0 "Erudite"
trait_ruler_kaltsit_knowledgeable_desc:0 "§GKal'tsit§! possesses profound knowledge in metallurgical industry, sociology, Originium Arts, archaeology, historical genealogy, economics, botany and geology."
trait_ruler_efficient_infrastructure:0 "Efficient Infrastructure"
trait_ruler_efficient_infrastructure_desc:0 "This leader knows the importance of infrastructure and how to maximize its returns."
trait_ruler_meet_end:0 "Meet at the End of Civilization"
trait_ruler_meet_end_desc:0 "§LAt the end of civilization, decorated with darkness and the light of the stars, we too shall meet again...§!"
trait_ruler_babel_evil_spirit_w:0 "The Evil Spirit of Babel"
trait_ruler_babel_evil_spirit_w_desc:0 "Terrans cannot understand the Doctor's ruthlessness. It is still unknown what means the Doctor used and how many pieces were sacrificed to win a single game of chess.\nThe Doctor §Lwill, under the catalysis of war, transform into the §!§REvil Spirit of Babel§!§L in §!§R1 year§!§L!§!"
trait_ruler_babel_evil_spirit_l:0 "§LEvil Spirit of Babel§!"
trait_ruler_babel_evil_spirit_l_desc:0 "§BThe Doctor§! cannot remember anything. He/she could be a teacher, a researcher, or the one who tipped the scales of power."
trait_ruler_babel_evil_spirit_r:0 "§REvil Spirit of Babel§!"
trait_ruler_babel_evil_spirit_r_desc:0 "§RThe Doctor§! is now a war machine. In this machine's eyes there is only war and victory; everything else is irrelevant.\n§RThe Doctor§!§L will, after §!§G1 year§!§L of peace, transform into§! the Evil Spirit of Babel§L.§!"
trait_ruler_doctor_healing:0 "Under Treatment"
trait_ruler_doctor_healing_desc:0 "This leader is undergoing physical or psychological treatment. During this period most work will be handed over to a temporary team, which causes a certain amount of administrative inefficiency."
leader_trait_meet_at_the_end:0 "$trait_scientist_meet_end$"
leader_trait_meet_at_the_end_desc:0 "$trait_scientist_meet_end_desc$"

# Governor #
leader_trait_biaozhunhua:0 "Standardization"
leader_trait_biaozhunhua_desc:0 "This leader advocates the institutionalization and standardization of work and production."
leader_trait_dizhixuejia:0 "Geologist"
leader_trait_dizhixuejia_desc:0 "This leader is an experienced geologist and can always propose ideal extraction plans."
leader_trait_jinshugongyi:0 "Metalworking"
leader_trait_jinshugongyi_desc:0 "This leader once worked in an infrastructure workshop and has some ideas about optimizing metalworking."
leader_trait_jixingzi:0 "Impatient"
leader_trait_jixingzi_desc:0 "This leader always completes construction tasks ahead of schedule, and is willing to raise the budget to do so."
leader_trait_manxingzi:0 "Laid-Back"
leader_trait_manxingzi_desc:0 "This leader always advances their work at a leisurely pace, unhurriedly bargaining with contractors in order to keep budgets and costs down."
leader_trait_mafanzhizaozhe:0 "Troublemaker"
leader_trait_mafanzhizaozhe_desc:0 "This leader is exceptionally gifted, yet always inexplicably brings a great deal of trouble and criticism."
leader_trait_shihuangzhe:0 "Scavenger"
leader_trait_shihuangzhe_desc:0 "This leader went through hard times, and has higher demands when it comes to avoiding unnecessary expenses."
leader_trait_zuozhanzhidaoluxiang:0 "Combat Record"
leader_trait_zuozhanzhidaoluxiang_desc:0 "This leader, a former Operator, is used to improving through watching combat records."
leader_trait_jiaoji:0 "Socializing"
leader_trait_jiaoji_desc:0 "This leader has excellent social skills and frequently contacts people from all walks of life to take part in mutually beneficial projects."
leader_trait_tanpan:0 "Negotiation"
leader_trait_tanpan_desc:0 "This leader is skilled at business negotiation and exchange of interests with the business world under complicated rules."
leader_trait_wuliuzhuanjia:0 "Logistics Expert"
leader_trait_wuliuzhuanjia_desc:0 "This leader was once an executive of a logistics company and has a unique view of finance and economics."
leader_trait_superintendent:0 "Former Superintendent"
leader_trait_superintendent_desc:0 "This leader, who comes from a police superintendent background, attaches great importance to police work."
leader_trait_wealthy:0 "Wealthy"
leader_trait_wealthy_desc:0 "A daughter of a wealthy Lungmen family, the apple of everyone's eye. The wealth her family brings has helped her establish a police force with generous benefits."
leader_trait_economy_measure:0 "Economic Acumen"
leader_trait_economy_measure_desc:0 "This leader possesses outstanding foresight and execution in economy and trade."
leader_trait_warlords:0 "Old Warlord"
leader_trait_warlords_desc:0 "This leader was once a warlord ruling his own region. He can mobilize his old subordinates and the young men of his hometown into the regular army at any time, but for this he is also criticized."
leader_trait_governor_kjera:0 "Kjera"
leader_trait_governor_kjera_desc:0 "As the deity of Kjerag's holy mountain she sees through everything, and as the dutiful head maid by the Saintess's side she has a unique view on keeping a star sector 'clean'."
leader_trait_governor_kjera_ruler:0 "$leader_trait_governor_kjera$"
leader_trait_governor_kjera_ruler_desc:0 "$leader_trait_governor_kjera_desc$"

# Science #
leader_trait_walk_in_dust_s:0 "Walk in the Dust"
leader_trait_walk_in_dust_s_desc:0 "In this seemingly endless journey, she has always been searching for the answer to the original question. Her answer."
leader_trait_unknown_technology:0 "Unknown Technology"
leader_trait_unknown_technology_desc:0 "§GKal'tsit§! has dabbled in some technologies that even modern science cannot yet explain."
trait_scientist_meet_end:0 "Meet at the End of Civilization"
trait_scientist_meet_end_desc:0 "§LAt the end of civilization, decorated with darkness and the light of the stars, we too shall meet again...§!"
leader_trait_precise_calculation:0 "Precise Calculation"
leader_trait_precise_calculation_desc:0 "This leader has never made a single mistake in the many experiments they have taken part in."
leader_trait_rhine_lab:0 "Former Rhine Lab Director"
leader_trait_rhine_lab_desc:0 "Many years have passed, yet many citizens still cannot understand her actions. Kristen also refused the request to return to Rhine Lab, choosing instead to become a scientist active on the front lines of research. Even as the years fly by, the scientific spirit and research methods in her mind never go out of date."
leader_trait_rhine_lab_2:0 "$leader_trait_rhine_lab$"
leader_trait_rhine_lab_2_desc:0 "$leader_trait_rhine_lab_desc$"
leader_trait_rhine_lab_3:0 "$leader_trait_rhine_lab$"
leader_trait_rhine_lab_3_desc:0 "$leader_trait_rhine_lab_desc$"
leader_trait_unstopable_pioneer:0 "Fearless Pioneer"
leader_trait_unstopable_pioneer_desc:0 "Kristen is undoubtedly one of the greatest researchers in a long time. She fears no challenge and dares to charge into the unknown. But sometimes her unscrupulous methods and ideas too far ahead of their time for ordinary people to understand have produced some unfortunate effects in the public sphere."

mod_pop_category_workers_physics_research_produces_add:0 "£pop_cat_worker£ $pop_cat_worker_plural$ produce £physics_research£ $physics_research$"
mod_pop_category_specialists_physics_research_produces_add:0 "£pop_cat_specialist£ $pop_cat_specialist_plural$ produce £physics_research£ $physics_research$"
mod_pop_category_rulers_physics_research_produces_add:0 "£pop_cat_ruler£ $pop_cat_ruler_plural$ produce £physics_research£ $physics_research$"
mod_pop_category_workers_engineering_research_produces_add:0 "£pop_cat_worker£ $pop_cat_worker_plural$ produce £engineering_research£ $engineering_research$"
mod_pop_category_specialists_engineering_research_produces_add:0 "£pop_cat_specialist£ $pop_cat_specialist_plural$ produce £engineering_research£ $engineering_research$"
mod_pop_category_rulers_engineering_research_produces_add:0 "£pop_cat_ruler£ $pop_cat_ruler_plural$ produce £engineering_research£ $engineering_research$"
mod_job_government_employee_add:0 "$job_government_employee$ job"




# Fleet #
leader_trait_commander_chivalry:0 "Chivalry"
leader_trait_commander_chivalry_desc:0 "This leader follows the honor and faith of chivalry, and has resolved to defeat all ugliness with the will of a knight."
leader_trait_ship_operation_maintenance:0 "Ship Maintenance"
leader_trait_ship_operation_maintenance_desc:0 "This leader was once a reliability engineer and software engineer aboard a landship. They can repair ships on their own and sell goods to the crew §L(???)§!"
leader_trait_jujizhuanjing:0 "Sniper Specialization"
leader_trait_jujizhuanjing_desc:0 "This leader places great importance on over-the-horizon projection of firepower in combat."
leader_trait_emergency_appointment:0 "Emergency Reassignment"
leader_trait_emergency_appointment_desc:0 "At a certain point this leader was urgently transferred from the marines to become a fleet commander."
leader_trait_lock_keys:0 "Lock and Key"
leader_trait_lock_keys_desc:0 "With the power granted by the Lock and Key, Mostima can influence the flow of time for ships within a certain range."
leader_trait_snacks_network:0 "Snack Network"
leader_trait_snacks_network_desc:0 "Empire fleet upkeep:§G-2.5%§!\n\nDur-nar has organized a vast snack network spanning the entire fleet, striving to supply everyone with the tastiest and cheapest snacks."
leader_trait_parts_network:0 "Spare Parts Network"
leader_trait_parts_network_desc:0 "Empire fleet upkeep:§G-5%§!\n\nDur-nar has organized a vast spare parts network spanning the entire fleet, striving to supply everyone with the best quality parts at the lowest price."
leader_trait_calcium:0 "Calcification"
leader_trait_calcium_desc:0 "Saria's ability to control the element calcium greatly increases the efficiency of repairing damaged sections of a ship."

# Army #
leader_trait_general_chivalry:0 "Chivalry"
leader_trait_general_chivalry_desc:0 "This leader follows the honor and faith of chivalry, and has resolved to defeat all ugliness with the will of a knight."
leader_trait_army_of_one:0 "One-Man Army"
leader_trait_army_of_one_desc:0 "This leader possesses powerful Originium Arts, and can single-handedly cut open an enemy's bunker complex on the battlefield like a god of war."
leader_trait_xianfengzhuanjing:0 "Vanguard Specialization"
leader_trait_xianfengzhuanjing_desc:0 "This leader is skilled at seizing the initiative in battle and creating opportunities for their own troops."
leader_trait_jinweizhuanjing:0 "Guard Specialization"
leader_trait_jinweizhuanjing_desc:0 "This leader is skilled at achieving defense through offense, or expanding an incursion while on the defensive."
leader_trait_shushizhuanjing:0 "Caster Specialization"
leader_trait_shushizhuanjing_desc:0 "This leader is skilled at commanding Arts units in Originium Arts bombardment of enemy forces."
leader_trait_zhongzhuangzhuanjing:0 "Defender Specialization"
leader_trait_zhongzhuangzhuanjing_desc:0 "This leader's troops stand immovable as a mountain in defense, and in attack they crush the enemy like a mountain as well."
leader_trait_tezhongzhuanjing:0 "Specialist Specialization"
leader_trait_tezhongzhuanjing_desc:0 "This leader has mastered mature special operations theory and is skilled at rapid raids and counter-encirclement."
leader_trait_military_fortress:0 "Military Fortress"
leader_trait_military_fortress_desc:0 "She is a hard shield, a steady bulwark, a fortress that will never fall before anyone else."
leader_trait_bloody_battle:0 "Bloody Battle"
leader_trait_bloody_battle_desc:0 "Shells swift as a storm, shields hard as iron walls. She will fight desperately on until the last drop of blood is shed."
leader_trait_frighten_box:0 "Jack-in-the-Box"
leader_trait_frighten_box_desc:0 "W tirelessly scatters mines across the front line, causing heavy casualties on both sides."
leader_trait_treachery:0 "Treachery"
leader_trait_treachery_desc:0 "To W, abandoning troops mired in enemy lines or indiscriminately wiping out both enemy and friendly forces is nothing to be surprised about."

## Empire Modifiers ##
terra_council:0 "Council Summit in Preparation"
terra_council_desc:0 "The next joint council summit is being prepared."
peak_plan_training:0 "Peak Plan in Progress"
peak_plan_training_desc:0 "A five-year talent development program is under way."
ark_eternal_doctor:0 "Meet at the End of the Star Sea"
ark_eternal_doctor_desc:0 "§RWill you still remember me§!"
snacks_network:0 "Snack Network"
snacks_network_desc:0 "Dur-nar has organized a vast snack network spanning the entire fleet, striving to supply everyone with the tastiest and cheapest snacks."
parts_network:0 "Spare Parts Network"
parts_network_desc:0 "Dur-nar has organized a vast spare parts network spanning the entire fleet, striving to supply everyone with the best quality parts at the lowest price."


## Planet Modifiers ##
catastrophe:0 "Catastrophe"
catastrophe_desc:0 "The collective name for the super natural disasters that occur frequently in the world of Terra, including but not limited to storms, blizzards, heavy rainfall, floods and even meteor strikes. After a Catastrophe passes, a mysterious mineral containing immense energy is often left behind: Originium. Researchers speculate that Catastrophes may be one of Originium's vectors of spread."
nomadic_city:0 "Nomadic City"
nomadic_city_desc:0 "A large population lives in mobile cities of varying sizes. To escape Catastrophes or the threat of war, these cities will split into smaller blocks to migrate, and reassemble their homes at their destination."
barbarian_growth:0 "Wild Growth"
barbarian_growth_desc:0 "Most people on this land live in an orderless, desolate wilderness. Their productivity is low, their existence is hard, and they are constantly under threat from Catastrophes and bandits."
wheels_motion:0 "First Steps"
wheels_motion_desc:0 "Mobilize people and resources, and take the first step toward reshaping the wilderness and the homes of its people."
strewn_thorns:0 "Strewn with Thorns"
strewn_thorns_desc:0 "The building of order is slow but steady. Under the threat of Catastrophes, Operators and messengers pushing deep into the wilderness trade blows with the enemy one after another."
autumn_sea:0 "Autumn Splendor"
autumn_sea_desc:0 "Those who bring order to the land will be praised. And for a long time to come, countless beneficiaries will throw themselves into the cause of the new world with fighting spirit."
infected_anxious:0 "Infected Anxiety"
infected_anxious_desc:0 "An Oripathy mortality rate higher than expected has led the Infected to question the relevant medical data and to anxiety for their own safety."
torn_society:0 "Torn Society"
torn_society_desc:0 "Desperate Infected are destroying social order, while the remnants of the split nations and the nationalists are taking the opportunity to cause trouble."
celebration:0 "Celebration of the Conquest of \"Oripathy\""
celebration_desc:0 "Grand celebrations of the conquest of \"Oripathy\" are being held in many places. Long afterward, some of these activities will also become local customs that carry on."
repression_failure:0 "Crackdown Failure"
repression_failure_desc:0 "A gravely failed riot-control operation by the planetary government has left almost the entire planet in a state of anarchy."
catastrophe_panic:0 "Catastrophe Panic"
catastrophe_panic_desc:0 "The appalling scenes left by a recent Catastrophe have triggered widespread panic across the globe."
corrosion:0 "Corrosion"
corrosion_desc:0 "\"Corrosion\" is a dangerous supernatural disaster on Talos-II. Areas affected by Corrosion develop distorted environments and anomalous physical phenomena."
g_wrtdjh_modifier:0 "Contaminated Land Purification"
g_wrtdjh_modifier_desc:0 "Purify and restore land once contaminated by Originium."
g_jssjjs_modifier:0 "Spiritual World Development"
g_jssjjs_modifier_desc:0 "Spiritual pillars and spiritual drive are the soul of our march into the stars."
g_wzsjjs_modifier:0 "Material World Development"
g_wzsjjs_modifier_desc:0 "Progress in material production is the foundation and prerequisite of our exploration of the infinite."
g_gdzbzzzc_modifier:0 "High-End Equipment Manufacturing Support"
g_gdzbzzzc_modifier_desc:0 "Development in high-end fields determines the overall competitiveness of a civilization's industry."
g_zlzycyzz_modifier:0 "Strategic Resource Industry Support"
g_zlzycyzz_modifier_desc:0 "The only way to prevent strategic resources from becoming a threat is to keep them in our own hands."
g_dqmszc_modifier:0 "Regional Tax Exemption Policy"
g_dqmszc_modifier_desc:0 "For purposes such as revitalizing the economy or post-disaster support, some regions enjoy tax exemption for a certain period of time."
g_jyzdbt_modifier:0 "Employment Guidance Subsidy"
g_jyzdbt_modifier_desc:0 "Citizens of the interstellar age should not be blocked by difficulty in choosing a career."
y_znjxzc_modifier:0 "Intelligent Machinery Support"
y_znjxzc_modifier_desc:0 "Efficient intelligent machinery will extend the reach of human activity and capability."
y_xxfyzl_modifier:0 "Planetary Defense Directive"
y_xxfyzl_modifier_desc:0 "Prepare for a war of attrition against threats from space."
y_cbfzgh_modifier:0 "City-State Development Plan"
y_cbfzgh_modifier_desc:0 "The rise of urbanization symbolizes the development and progress of civilization."
y_tkjdjs_modifier:0 "Space Fleet Construction"
y_tkjdjs_modifier_desc:0 "The number of warships determines the distance between the threat and us."
r_tllhscl_modifier:0 "Terra United Search Warrant"
r_tllhscl_modifier_desc:0 "Search out and suppress the remnants of the old world that resist to the bitter end."
originium_bombs_contaminated_0:0 "Under Originium Bombardment"
originium_bombs_contaminated_0_desc:0 "The planet is being bombarded with Originium bombs! Once planetary devastation exceeds 25%, Originium will leave massive contamination behind after the bombardment and infect the planet's inhabitants with acute Oripathy!"
originium_bombs_contaminated_1:0 "Originium Contamination"
originium_bombs_contaminated_1_desc:0 "This planet once suffered Originium orbital bombardment, which left temporary dangerous contamination behind and infected its inhabitants."
biochemical_protection:0 "Biochemical Protection"
biochemical_protection_desc:0 "This planet is currently under biochemical protection."
Terra_9_modifier:0 "Originium Farm"
Terra_9_modifier_desc:0 "An abandoned Originium mine of a precursor civilization. Orbital scans show that the root patterns of the Originium veins on the surface and the layout of the ruins of extraction facilities are highly regular, giving good reason to believe that this is a planet the precursor civilization used to \"plant\" Originium. However, after an unknown length of neglected maintenance, the planet has fallen completely into chaos."


## Planet Decisions ##
decision_biochemical_protection:0 "Biochemical Protection"
decision_biochemical_protection_desc:0 "Raise the entire planet's toxic protection level, so that the negative effects of Originium bombardment on the planet's population only take effect once devastation reaches 100%."
decision_biochemical_protection_effects_short:0 "Increases £stability£ §GStability§!.\n\nReduces £job£ §Rresource production from jobs§! and £mod_bonus_pop_growth_mult£ §Rpopulation growth§!."
decision_biochemical_protection_effects_custom:0 "The $bombardment_originium_bombs$ suffered by the planet will begin to cause contamination only once §YDevastation§! reaches §R100%§!."
decision_end_biochemical_protection:0 "End Biochemical Protection"
decision_end_biochemical_protection_desc:0 "End the current biochemical protection and restore normal social order."
decision_end_biochemical_protection_effects_short:0 "The biochemical protection on this planet has ended."
decision_ark_arclight_well4a:0 "Construct the S.H.A.F.T. Array"
decision_ark_arclight_well4a_desc:0 "On the basis of the existing Arc-XIV S.H.A.F.T., build three more S.H.A.F.T.s evenly spaced along the equator.\n\n§RWarning: the new buildings will run for one year at a base upkeep of §Y960§!£energy£§YEnergy Credits§!!§!"
decision_ark_arclight_well4b:0 "$decision_ark_arclight_well4a$"
decision_ark_arclight_well4b_desc:0 "On the basis of the existing Arc-XIV S.H.A.F.T., build three more S.H.A.F.T.s evenly spaced along the equator.\n\n§RWarning: the new buildings will run permanently at a base upkeep of §Y300§!£energy£§YEnergy Credits§!!§!"

## Resources ##
originiums:0 "Originium"
originiums_desc:0 "A mysterious mineral born alongside Catastrophes. It contains immense energy, and has also given rise to the existence of the Infected."
originiums_deficit:0 "Originium Shortage"
d32_steels:0 "D32 Steel"
d32_steels_desc:0 "An artificial metal material that should not exist in nature. Its strength is exceptional and it cannot be pierced, and it conducts Originium Arts smoothly."
d32_steels_deficit:0 "D32 Steel Shortage"
multipole_nanosheets:0 "Multi-Polar Nanoflakes"
multipole_nanosheets_desc:0 "A crystallization of modern manufacturing creativity: a device sensitive to the Originium around it. It can increase the sensitivity of Originium energy devices and store Originium Arts, making it an indispensable material for an Originium energy society."
multipole_nanosheets_deficit:0 "Multi-Polar Nanoflake Shortage"
ark_dimensional_fluid:0 "Dimensional Fluid"
ark_dimensional_fluid_warhead:0 "Collapse Warhead"
## Planet Deposits ##
d_infection_blockade:0 "Infection Blockade Zone"
d_infection_blockade_desc:0 "A cordoned-off post-disaster area with an extremely high risk of infection. Countless highly radioactive giant Originium deposits tower over the surface."
d_originiums_mine:0 "Originium Mining Zone"
d_originiums_mine_desc:0 "Catastrophes ravage this region year after year, and the high-quality Originium deposits that have accumulated over the years are being steadily extracted."
d_lungmen_special_economic_zone:0 "Lungmen Special Economic Zone"
d_lungmen_special_economic_zone_desc:0 "The birthplace of Terra's new economic order, Lungmen has now become a vast, commercially developed metropolis."
d_holy_mountain:0 "Mount Karlan"
d_holy_mountain_desc:0 "Legend says that the holy mountain is the dwelling place of the god who shields the snow realm from Catastrophes. Many tourists come to see it, but apart from the Saintesses of every generation, no one has ever reached the summit."
d_sargon_rainforest:0 "Sargon Rainforest"
d_sargon_rainforest_desc:0 "A vast rainforest within Sargon's borders. This vibrant oasis has nurtured many tribes, and is one of the rare pure lands seldom visited by Catastrophes."
d_foehn_hot_earth:0 "Foehn Hotlands"
d_foehn_hot_earth_desc:0 "A wasteland south of Sargon, an extremely arid region. History records almost no one who has ever crossed it, even in the records of the Padishahs of Sargon."
d_ursus_tundra:0 "Ursus Tundra"
d_ursus_tundra_desc:0 "A bitterly cold land once used for exiling and enslaving the Infected."
d_ursus_development:0 "Ursus New Development Zone"
d_ursus_development_desc:0 "A new industrial zone built upon the vast frozen soil, replacing the inefficient mines of the past and making that memory of suffering history once and for all."
d_rimbilliton_industrial_belt:0 "Rim Billiton Industrial Belt"
d_rimbilliton_industrial_belt_desc:0 "An industrial belt that gradually grew up around Steel Carrot City in southern Rim Billiton; even the air smells of copper rust."
d_silent_deep_sea:0 "Silent Deep Sea"
d_silent_deep_sea_desc:0 "A lifeless stretch of ocean. Any attempt at agricultural production here is wasted effort."
d_former_countries_controlled:0 "Split Nations' Controlled Zone"
d_former_countries_controlled_desc:0 "Areas still controlled by the remnants of the split nations. Clearing them out is not as simple as a military strike."
d_ark_aegir_generator: "Project Horizon Arc Energy Array"
d_ark_aegir_generator_desc: "A large-scale energy facility built on advanced Aegir technology, intended to provide an endless supply of energy to the S.H.A.F.T.s located above the ocean."
d_originiums_3:0 "£originiums£+3"
d_originiums_3_desc: "$d_originiums_3$"
d_ark_frozen_planet_deposit: "Frozen Originium Crystal Forest"
d_ark_frozen_planet_deposit_desc: "Baptized by Frostnova, this planet has fallen into utter chaos, but some relatively stable places still hold extractable resources."




## edict ##
edict_originiums_fire:0 "Enhanced Firepower"
edict_originiums_fire_desc:0 "Provide combat ships with incremental Originium ammunition and energy crystals."
edict_originiums_ahead:0 "Full Speed Ahead"
edict_originiums_ahead_desc:0 "Supplying the ship's reactors with costly specially made Originium fuel can aid our faster-than-light travel."
edict_d32_steels_defense:0 "Reinforced Defense"
edict_d32_steels_defense_desc:0 "Equip more advanced D32 Steel materials to strengthen ship armor and structure. Not economical, but solid and effective."
edict_multipole_nanosheets_operation:0 "Weapon Operation"
edict_multipole_nanosheets_operation_desc:0 "Equip ships with more multi-polar nanoflakes. Before these nanoflakes are exhausted, the operating efficiency of our fleet's weapon systems will be noticeably improved."
edict_multipole_nanosheets_efficient_fleet:0 "Efficient Fleet"
edict_multipole_nanosheets_efficient_fleet_desc:0 "Equip ships with more multi-polar nanoflakes. Before these nanoflakes are exhausted, our fleet's routine upkeep costs will be reduced."
edict_multipole_nanosheets_efficient_building:0 "Efficient Buildings"
edict_multipole_nanosheets_efficient_building_desc:0 "Install more multi-polar nanoflakes in buildings. Before these nanoflakes are exhausted, the routine upkeep of districts and buildings will be reduced."
edict_sarkaz_conscription_system:0 "Sarkaz Conscription System"
edict_sarkaz_conscription_system_desc:0 "This conscription system ensures that recruits for army service are screened first from among the Sarkaz."
edict_power_city_module:0 "Power City Module"
edict_power_city_module_desc:0 "With an adequate supply of Originium, we can greatly accelerate the construction of districts and buildings."
edict_power_space_module:0 "Power Space Module"
edict_power_space_module_desc:0 "With an adequate supply of Originium, we can greatly accelerate the construction of space fleets."
edict_power_mega_engineering_module:0 "Power Megastructure Module"
edict_power_mega_engineering_module_desc:0 "With an adequate supply of Originium, we can greatly accelerate the construction of megastructures."

## Armies ##
former_countries_army:0 "Former National Legions"
former_countries_army_desc:0 "The equipment and training of the former national legions are roughly on par with the regular armies of the nations before unification. Strictly speaking, they are industrial-age armies."
racists_rebel9_army:0 "Sarkaz Mercenary Legion"
racists_rebel9_army_desc:0 "The Sarkaz Mercenary Legion is made up of Sarkaz who have long worked as mercenaries. Their racial advantages and experience in the ranks make them extremely formidable in combat."
land_warship_army:0 "Landship Fleet"
land_warship_army_desc:0 "An amphibious warship like a small city, built with nomadic city technology. It possesses extremely strong firepower and force projection capability."
landwarship_troop_limit_tooltip:0 "The landship is the military application of nomadic city technology: a powerful mobile ground firepower platform. It can also be assembled in orbit and dropped onto an enemy planet for an assault, but due to its enormous bulk, once it has landed it can never return to orbit."
galaxy_warship_army:0 "Vanguard Landship Fleet"
galaxy_warship_army_desc:0 "These small-city-like landships trade a slight reduction in various attributes for the ability to enter the atmosphere and then return to planetary orbit."
galaxywarship_troop_limit_tooltip:0 "The vanguard landship is an innovation that arose from nomadic city technology in the field of military expeditions."

## Ascension ##
ap_resister_of_the_end:0 "Resister of the End"
ap_resister_of_the_end_desc:0 "Suffering has taught us that survival is a blessing, not something that can be taken for granted. A starry sky as calm as water is against all reason; and when that dreadful crisis that is bound to come shrouds the galaxy, all we can do is rely on ourselves and defend the future of our species and the meaning of our existence at any cost."
enable_contingency_contract_project:0 "§HIssue Special Project:§! Contingency Contract\n\n"
describe_contingency_contract_project:0 "Complete 5 §YContingency Contract§! projects, and the various attributes of our starbases, defense platforms and ships will each be improved."
ark_ascension_perks.1.name:0 "Contingency Contract"
ark_ascension_perks.1.desc:0 "When we overcome the Catastrophes and step into the infinite, it is merely a leap from one shackle into another, deeper one. The dark forces from the depths of the universe still hunt all living things mercilessly. Someone must stop the disaster from spreading, or we will be helpless before the enemy devours us. 5 special projects will be unlocked to strengthen the only military power we can rely on to resist invasion."
ark_ascension_perks.1.a:0 "Confirm"
CONTINGENCY_CONTRACT_1_PROJECT:0 "Contingency Contract: Armament"
CONTINGENCY_CONTRACT_1_PROJECT_DESC:0 "The damage dealt by all of the empire's starbases and defense platforms is greatly increased, and the weapon damage of all ships is slightly increased."
CONTINGENCY_CONTRACT_2_PROJECT:0 "Contingency Contract: Assault"
CONTINGENCY_CONTRACT_2_PROJECT_DESC:0 "The weapon fire rate of all of the empire's starbases, defense platforms and ships is increased, and the sublight speed of all ships is increased."
CONTINGENCY_CONTRACT_3_PROJECT:0 "Contingency Contract: Preparation"
CONTINGENCY_CONTRACT_3_PROJECT_DESC:0 "The hull points of all of the empire's starbases and defense platforms are greatly increased, and the hull points of all ships are slightly increased; the shield points and armor of all starbases, defense platforms and ships are increased, and the orbital bombardment damage taken by planets is reduced."
CONTINGENCY_CONTRACT_4_PROJECT:0 "Contingency Contract: Craftsmanship"
CONTINGENCY_CONTRACT_4_PROJECT_DESC:0 "The cost, upkeep and upgrade cost of all of the empire's starbases and their buildings and modules, and of all ships, are reduced."
CONTINGENCY_CONTRACT_5_PROJECT:0 "Contingency Contract: Deployment"
CONTINGENCY_CONTRACT_5_PROJECT_DESC:0 "The upgrade speed and build speed of all of the empire's starbases, buildings, modules and defense platforms are greatly improved, and the upgrade speed and build speed of all ships are slightly improved."
