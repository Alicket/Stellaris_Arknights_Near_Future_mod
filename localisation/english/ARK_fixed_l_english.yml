ark_ascension_perks.11.a:0 "Excellent"
ark_ascension_perks.12.name:0 "Project Complete"
ark_ascension_perks.12.desc:0 "Through careful planning and the necessary investment in research, the weapon fire rate of all our starbases, defense platforms and ships is now improved."
ark_ascension_perks.12.a:0 "Excellent"
