## Intro ##
START_SCREEN_ARK_1:0 "The Ancients descended upon this world, bringing with them different races and cultures, and created the demi-human races of Terra. The people multiplied on a land ravaged by Catastrophes, using \"Originium\", a product of those Catastrophes, to develop their tribes and societies, and built many industrial nations founded on Originium as an energy source. In modern times, the social contradictions and conflicts brought about by the uneven development of civilization have grown ever sharper, and alien creatures that had long dwelt beyond the borders of civilization reappeared, prompting many demi-human nations and regions to set aside their prejudices and form a United World dedicated to defending our fragile civilization.\n\nYet, despite all the new government's efforts for peace regardless of race or stance, some nations still refuse to communicate and cooperate with the United Government, and even adopt a hostile posture. And those Catastrophes of unknown cause, the incursions of alien creatures and the unearthing of advanced ancient devices all plainly show that our world hides layer upon layer of mysteries."
START_SCREEN_ARK_2:0 "The Ancients descended upon the world, bringing different races and cultures. The people multiplied on a land ravaged by Catastrophes, using \"Originium\", the product of those Catastrophes, to develop their tribes and societies, and standing upon Originium they opened the door to industrial civilization. Yet the infectious and fatal diseases brought by Originium planted the seeds of disaster, which ultimately gave rise to unbearably sharp social contradictions and national conflicts and ended in a world war. Tempered in blood and fire, a frontline commander of the former Babel overturned the balance of power with absolute command talent and iron-fisted means, crushed many factions and founded a new empire on the ruins of the nations, declaring as the victor that he was the sole master of this suffering land.\n\nYet, although the new empire brought a new order to this suffering land... Oripathy still cannot be cured; diehard resisters and separatist organizations still lurk in dark corners with malice in their hearts. And those Catastrophes of unknown cause, all kinds of paranormal incidents and the unearthing of advanced ancient devices seem all the more to show that our world hides layer upon layer of mysteries."

## Terra System Initializer ##
Tyra_system_NAME:0 "Terra System"
Tyra_system_DESC:0 "The star system in which the homeworld of the Terrans of Terra is located.\n\n$system_initializer_DESC$"
pc_ark_originium_frozen:0 "Frozen Originium Planet"
pc_ark_originium_frozen_desc:0 "The surface temperature is extremely low, and ice crystals wrap around giant Originium crystals deeply embedded in the ground. No one knows how deep their roots beneath the surface go. The atmosphere is filled with volatile Originium gas and deadly Originium dust; aside from machines, few would be willing to take a walk down there."

