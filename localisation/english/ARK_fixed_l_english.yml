orbital_bombardment_originium_bombs_desc:0 "Bombard the target planet with Originium bombs, contaminating the bombed planet and its population as much as possible.\n\n§EAllows the \"Originium\" orbital bombardment stance.§!"
bombardment_originium_bombs:0 "Originium"
