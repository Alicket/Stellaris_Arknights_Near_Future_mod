## Grand Archive ##
ark_glow_of_stars:0 "Glow of the Star Garden"
ark_glow_of_stars_desc_short:0 "In that instant, the light of the real shone across the land"
ark_glow_of_stars_desc_details:0 "A decorative gyroscope recovered from the Star Garden. Worn by the passage of time, it no longer spins freely. It marks the first time the Terrans broke through the sky and touched the stars.\n§gOutput and upkeep are both affected by empire size§!"
ark_resplendent_sob:0 "Resplendent Lament"
ark_resplendent_sob_desc_short:0 "His blood still flows; he has never truly left this place."
ark_resplendent_sob_desc_details:0 "A dazzling crystal, so vividly red it seems about to drip blood. Approach it, and you can almost feel an ancient wound.\n§gOutput and upkeep are both affected by empire size§!"

## Megastructures ##
ark_ground_star_gate:0 "Surface Gateway"
ark_ground_star_gate_DESC:0 "§CA mysterious giant ring-shaped structure, in which time and space flow.§!\n\nSince the gateways of Terra and Talos-II were reconnected, large numbers of Terrans have come to Talos-II through the gateway, and the people of Talos-II have been able to go back and revisit their place of origin."
