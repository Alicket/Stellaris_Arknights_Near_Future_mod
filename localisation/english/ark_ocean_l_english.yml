#Species Traits
trait_ARK_ocean_seaborn:0 "Seaborn"
trait_ARK_ocean_seaborn_desc:0 "§BHe only said that a myriad of scales shall become one and fly into deep space. Only said that the sea shall be daubed with light, waxing and waning, never running dry.§!\nRegardless of citizenship, all organic Pops without the §BSeaborn§! trait will be forcibly converted at a certain yearly rate into the main species with the §BSeaborn§! trait; assimilated Pops gain a small amount of £arkseaborn_cells£§YVital Cells§! and £unity£§YUnity§!.\nUnlocks the Cognition Moulding panel.\nEnables a unique colony evolution path.\n§RCurrently incompatible with the Synthetic Evolution path§!"

#Leader Traits
leader_trait_ruler_seaborn:0 "Seaborn"
leader_trait_ruler_seaborn_desc:0 "§B$trait_ARK_ocean_seaborn_desc$§!"
leader_trait_Ishar_mla:0 "Echoing Will"
leader_trait_Ishar_mla_desc:0 "§BThe gods never prophesy a misty future, and never make unrealistic promises.§!"
leader_trait_Ishar_mla02:0 "Ancestral Mentor"
leader_trait_Ishar_mla02_desc:0 "§BA god§!"
leader_trait_seaborn_sci_simple_thoughts:0 "Simple Thoughts"
leader_trait_seaborn_sci_simple_thoughts_desc:0 "§BThe Seaborn mind does not seem very sensitive to these things...§!"
leader_trait_seaborn_sci_complex_thoughts:0 "Complex Circuits"
leader_trait_seaborn_sci_complex_thoughts_desc:0 "§BThis scientist is a rare Seaborn individual with extremely complex neural circuits, exceptionally suited to research work.§!"
leader_trait_seaborn_arm_strategic_mind:0 "Strategic Circuits"
leader_trait_seaborn_arm_strategic_mind_desc:0 "The combat sub-individuals responsible for command periodically share thought-simulated battles, creating a highly refined command thought pattern that keeps iterating and updating."
#Planet
