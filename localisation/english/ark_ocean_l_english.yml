pc_ark_continental_ocean:0 "Caerula Sea Planet"
pc_ark_continental_ocean_desc:0 "Whatever this planet once was - vibrant and lush, or utterly lifeless - now only land covered in thick Caerula traces remains, along with the eerie light they are giving off."
pc_ark_continental_ocean_adj:0 "Caerula Sea"
mod_pc_ark_continental_ocean_habitability:0 "Caerula Sea Planet Habitability"
ark_ocean_evolution_start:0 "Evolution"
ark_ocean_evolution_mid:0 "$ark_ocean_evolution_start$"
ark_ocean_evolution_end:0 "$ark_ocean_evolution_start$"
ark_ocean_evolution_disabled:0 "Suspend Evolution"
ark_ocean_evolution_disabled_desc:0 "The Seaborn on this planet need more resources to sustain a life out of their element."
ark_ocean_evolution_start_desc:0 "§B[This.GetName]§! evolution level: §R[this.var_ark_ocean_colony_evolution]§!\nAdvances to the next stage at §Y0§! or above."
ark_ocean_evolution_mid_desc:0 "§B[This.GetName]§! evolution level: §Y[this.var_ark_ocean_colony_evolution]§!\nEvolution completes at §G100§! or above."
ark_ocean_evolution_end_desc:0 "§B[This.GetName]§! evolution level: §G[this.var_ark_ocean_colony_evolution]§!\n§GThe evolution process is complete!§!"
MESSAGE_ARK_OCEAN_EVOLUTION_INCREASE_TITLE:0 "Ecology Adapted"
MESSAGE_ARK_OCEAN_EVOLUTION_REDUCE_TITLE:0 "Ecological Adaptation Has Regressed"
MESSAGE_ARK_OCEAN_EVOLUTION_COMPLETE_TITLE:0 "Environment Fully Assimilated"
MESSAGE_ARK_OCEAN_EVOLUTION_REDUCE_TERRAFORM_TITLE:0 "Evolution Level Lost"

MESSAGE_ARK_OCEAN_EVOLUTION_INCREASE_LOC:0 "Our colonists on [This.GetName] have fully adapted to the local ecology"
MESSAGE_ARK_OCEAN_EVOLUTION_REDUCE_LOC:0 "For some reason our colonists on [This.GetName] have become less adapted to the local ecology"
MESSAGE_ARK_OCEAN_EVOLUTION_COMPLETE_LOC:0 "Our colonists on [This.GetName] have turned the entire planet into our second home"
MESSAGE_ARK_OCEAN_EVOLUTION_REDUCE_TERRAFORM_LOC:0 "[This.GetName] has lost all of its evolution level because of a recent large-scale terraforming, and the inhabitants must adapt to the planet's environment all over again."

decision_ark_seaborn_disable_evolution:0 "Suspend the Seaborn Evolution Process"
decision_ark_seaborn_disable_evolution_desc:0 "This planet looks rather interesting. Let us keep it the way it is."
decision_ark_seaborn_resume_evolution:0 "Resume the Seaborn Evolution Process"
decision_ark_seaborn_resume_evolution_desc:0 "Those things are useless to the Seaborn collective. Continue turning it into a new home."

#Features and Districts
d_arkocean_deepsea:0 "Lush Deep Sea"
d_arkocean_deepsea_desc:0 "This tranquil deep sea, glowing faintly blue, is the most ideal habitat for the Seaborn collective; countless individuals live and hunt within it."
d_arkocean_generator:0 "Old Terran Power Facility"
d_arkocean_generator_desc:0 "This is the energy production site of an old Terran land nation, completely scrapped in the Second Great Silence. With the knowledge the Seaborn collective has learned from the old era, restoring production should not be difficult."
d_arkocean_mine:0 "Old Terran Mineral Mining Site"
d_arkocean_mine_desc:0 "This is the mine of an old Terran land nation, completely scrapped in the Second Great Silence. With the knowledge the Seaborn collective has learned from the old era, restoring production should not be difficult."
d_arkocean_terra_city:0 "Old Terran Shelter"
d_arkocean_terra_city_desc:0 "After the Great Silence the old Terrans were routed, and this is the last piece of land not swallowed by the sea, kept from the Seaborn collective's grasp through negotiation. After a long period of chaos it seems finally to have stabilized inside, and the old Terrans there have begun a life of lingering survival."

#events
ark_seaborn_base.10.title:0 "Choose a Ruler Portrait"
ark_seaborn_base.10.desc:0 "What appearance do you think Ishar-mla will take to lead the Seaborn collective?\nNote: since the Elite 2 artwork and \"Sublimation\" look very out of place in the cabinet, only the following two choices are available."
ark_seaborn_base.10.a:0 "Skadi the Corrupting Heart - Elite 1"
ark_seaborn_base.10.b:0 "Skadi the Corrupting Heart - Elite 2"
ark_seaborn_base.10.c:0 "Skadi the Corrupting Heart - Sublimation"
ark_seaborn_base.10.d:0 "First Speaker"
ark_seaborn_base.10.e:0 "No Change"
ark_seaborn_base.10.e.tooltip:0 "Keep the current state"
NAME_Ishar_mla:0 "Ishar-mla"
ark_seaborn_base.201.title:0 "A Perfect Home"
ark_seaborn_base.201.desc:0 "When the pioneers finished their rough survey of the planet, word came: this planet has an environment exactly like our homeworld! At this rate, assimilating the entire planet will take only half a year."
ark_seaborn_base.201.a:0 "Excellent!"
ark_seaborn_base.201.a.tooltip:0 "Gain §G394§! Evolution Points"
ark_seaborn_base.202.title:0 "Similar Ecology"
ark_seaborn_base.202.desc:0 "When the pioneers finished their rough survey of the planet, word came: this planet's ecology is highly similar to our homeworld's, which will save us a great deal of effort in assimilating it."
ark_seaborn_base.202.a:0 "Good."
ark_seaborn_base.202.a.tooltip:0 "Gain §G200§! Evolution Points"
ark_seaborn_base.21.title:0 "Reaching a New Home"
ark_seaborn_base.21.desc:0 "This is the first time we live in a wholly new environment beyond our homeworld. The first thing to do is to establish ourselves as other species do, in the safest way, and when the time is ripe our kin can turn the whole planet into a paradise of ocean."
ark_seaborn_base.21.a:0 "Then let us begin."
ark_seaborn_base.21.a.tooltip:0 "Start the evolution process through a planetary decision; the planet will eventually become a Caerula Sea Planet, providing a certain amount of bonuses. While the evolution level is between §R-200§! and §Y0§!, the evolution process can be paused through a planetary decision"
decision_ark_seaborn_start_evolution:0 "§B<Seaborn>§! Begin Planetary Evolution"
decision_ark_seaborn_start_evolution_desc:0 "Endlessly evolving and assimilating is the basic way of the Seaborn's reproduction. Newly arrived on a strange planet, we can first establish ourselves. When the time is ripe, our kin will do their utmost to turn the whole planet into a paradise of ocean.\n§gStarts the assimilation process. It begins with §!§Rsevere penalties§g, and over time will §!§Bcover the planet in Caerula traces§g, providing substantial bonuses.§!"

#Not used for now
#ark_seaborn_base.25.title:0 "Something may have gone wrong with Seaborn colonial evolution!"
#ark_seaborn_base.25.desc:0 "An unconsidered possibility was triggered during Seaborn evolution on §B[This.GetName]§!. Please contact the developer and describe what happened!"
#ark_seaborn_base.25.a:0 "Please check the Workshop description"

ark_seaborn_base.2301.title:0 "Capricious Climate"
ark_seaborn_base.2301.desc:0 "The surface climate of §B[This.GetName]§! is capricious; whenever our kin finish evolving for the local climate, new extreme weather arrives. This greatly delays the species' adaptation to this planet."
ark_seaborn_base.2301.a:0 "Evolution... needs to be stronger..."
ark_seaborn_base.2301.a.tooltip:0 "Evolution level reduced by §R20§!"
ark_seaborn_base.2302.title:0 "A Rampaging Beast"
ark_seaborn_base.2302.desc:0 "Contact was lost with one of our kin on §B[This.GetName]§!. The Seaborn collective received the message it uploaded in its final moments: it had disturbed a giant beast lurking underground, and the rampaging beast tore it apart in an instant... This information is critical, for the Seaborn collective did not know that such creatures existed beneath this planet."
ark_seaborn_base.2302.a:0 "Expansion... must be delayed..."
ark_seaborn_base.2302.a.tooltip:0 "Evolution level reduced by §R10§!"
ark_seaborn_base.2303.title:0 "Docile Food"
ark_seaborn_base.2303.desc:0 "Our kin have found a new species in the rock layers of §B[This.GetName]§!. They live on minerals, are docile in nature, and grow plump on very little mineral intake... This is without doubt excellent food, and this region will clearly soon become a new giant breeding pool."
ark_seaborn_base.2303.a:0 "Fresh, delicious... nutritious"
ark_seaborn_base.2303.a.tooltip:0 "Evolution level increased by §G20§!"
ark_seaborn_base.2304.title:0 "Barren Resources"
ark_seaborn_base.2304.desc:0 "Water... plants and animals... all are rare treasures on §B[This.GetName]§!. Such barren resources make it difficult for our kin to evolve, and the Seaborn collective struggles in this situation; it seems the day we fully colonize this planet is farther off than we imagined."
ark_seaborn_base.2304.a:0 "Wait... gather strength"
ark_seaborn_base.2304.a.tooltip:0 "$ark_seaborn_base.2301.a.tooltip$"
ark_seaborn_base.2305.title:0 "Cold Wave"
ark_seaborn_base.2305.desc:0 "The surface of §B[This.GetName]§! is flat and vast, with very few hills or mountains. So when a sudden cold wave struck the colony, our kin had nowhere to hide. In the first few days and nights, countless kin lacking nutrition and unable to evolve cold-resistant structures were frozen in the wind."
ark_seaborn_base.2305.a:0 "Contract... store nutrition"
ark_seaborn_base.2305.a.tooltip:0 "$ark_seaborn_base.2302.a.tooltip$"
ark_seaborn_base.2306.title:0 "Water Beneath the Rock"
ark_seaborn_base.2306.desc:0 "As the Seaborn collective expected, great quantities of water are stored beneath §B[This.GetName]§!, existing there in the form of ice, unchanging since ancient times. Without a doubt, in the evolution to come our kin will be \"like a fish in water\"."
ark_seaborn_base.2306.a:0 "Water, ocean... life"
ark_seaborn_base.2306.a.tooltip:0 "Evolution level increased by §G15§!"
ark_seaborn_base.2307.title:0 "Spring Among the Seaborn"
ark_seaborn_base.2307.desc:0 "Since the Seaborn collective landed on §B[This.GetName]§!, our kin have explored a place so full of life for the first time; the ecology of plants and animals here is astonishingly thriving... Thanks to them, the Seaborn collective has expanded faster than expected."
ark_seaborn_base.2307.a:0 "Nourishment, flourishing... prosperity"
ark_seaborn_base.2307.a.tooltip:0 "Evolution level increased by §G30§!"

