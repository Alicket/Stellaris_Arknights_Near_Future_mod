#Origin
origin_ark_stella_caerula:0 "Stella Caerula"
origin_ark_stella_caerula_desc:0 "Play as a powerful Seaborn species, evolving endlessly to turn the entire galaxy into kin."
#origin_tooltip_ark_stella_caerula_effects:0 "Regardless of citizenship, all organic Pops without the §BSeaborn§! trait will be forcibly assimilated at a certain yearly rate into the main species with the §BSeaborn§! trait; assimilated Pops gain Vital Cells and a small amount of Unity.\nUnlocks a unique evolution path.\nColonies will gradually be transformed into §BCaerula Sea Planets§!, providing production bonuses."
origin_tooltip_ark_stella_caerula_effects:0 "This origin currently has no content in this version and serves only as a placeholder. All Seaborn-related content can be experienced after choosing the §BSeaborn§! trait!\nThat also means you may freely choose other origins, or treat the Seaborn trait like traits with extra content such as §BAquatic§! or §GToxic§! - no special restriction applies.\n§gFor example, Seaborn Terrans!§!"

#Resource
arkseaborn_cells:0 "Vital Cells"
arkseaborn_cells_desc:0 "Precious primordial cells that can be used for the evolution of the species."
arkseaborn_cells_deficit:0 "Vital Cell Shortage"
mod_planet_jobs_arkseaborn_cells_produces_mult:0 "£job£ jobs produce £arkseaborn_cells£ $arkseaborn_cells$"

