#AUTH_ARKOCEAN_SEABORN_ASSIMILATION:0 "Can assimilate foreign §H £pop£ Pops§! at a certain rate, converting them into the main species, regardless of whether they have §RAssimilation§! citizenship.\n§RRobots will be dismantled§!."
#auth_arkocean_seaborn:0 "Deep Sea Consciousness"
#auth_arkocean_seaborn_desc:0 "A more efficient and mysterious hive mind that obeys the single will of the species, allowing every individual to reach its greatest potential."

